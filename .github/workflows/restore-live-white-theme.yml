name: Restore L&J Live white background

on:
  push:
    paths:
      - '.github/workflows/restore-live-white-theme.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore Live white theme
        run: python .github/scripts/restore_live_white_theme.py
      - name: Commit Live white theme
        run: |
          git config user.name 'L&J Site Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add ljlivepred_app.js live/live.css
          if git diff --cached --quiet; then
            echo 'L&J Live white theme already applied.'
            exit 0
          fi
          git commit -m 'Restore white background across all L&J Live pages'
          git push origin HEAD:master
