name: LSI Near-Event Market Watch

on:
  workflow_dispatch:
  schedule:
    - cron: '27 * * * *'

permissions:
  contents: write

concurrency:
  group: lsi-core-data-writer
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: {ref: master, fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}

      - name: Refresh near-event POM inventory
        continue-on-error: true
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY || vars.PROPLINE_API_KEY }}
          PROP_LINE_API_KEY: ${{ secrets.PROP_LINE_API_KEY || vars.PROP_LINE_API_KEY }}
          PROPLINE_HTTP_TIMEOUT_SEC: '8'
          PROPLINE_HTTP_ATTEMPTS: '1'
        run: python scripts/propline_adapter.py

      - name: Refresh NFL player props when due
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ENABLE_THE_ODDS_API: 'true'
          ODDS_API_LEAGUES: 'NFL'
          ODDS_API_LOOKAHEAD_HOURS: '96'
          ODDS_API_MAX_EVENTS_PER_RUN: '16'
          ODDS_API_PROP_TTL_MIN: '240'
        run: python scripts/odds_adapter.py

      - name: Refresh persistent registry and local spectrum cache
        run: python scripts/lsi_history_warehouse.py

      - name: Recalculate individualized LJPC
        run: python scripts/legz_statistical_spectrum.py

      - name: Publish rolling market board
        run: python scripts/lsi_publish_future_board.py

      - name: Measure T-48 coverage
        run: python scripts/lsi_t48_coverage.py

      - name: Commit changed near-event intelligence
        shell: bash
        run: |
          git config user.name 'LEGZ-JINX LSI'
          git config user.email 'actions@users.noreply.github.com'
          git add data/qc_prop_board.json data/future_market_board.json data/future_market_board.js data/market_history.csv data/propline_intelligence.json data/propline_state.json data/the_odds_api_state.json data/lsi_player_registry.json data/lsi_spectrum_cache.json data/ljpc_coverage.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No near-event intelligence changes.'
            exit 0
          fi
          git commit -m "LSI hourly near-event market watch"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin master
            if git push origin master; then exit 0; fi
            sleep 3
          done
          exit 1
