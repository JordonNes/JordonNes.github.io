name: Install L&J Daily Refresh Overlay

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/install-dailyrefresh.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Insert current refresh layer into DP pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pages = [
              'LJ_index.html','MLB.html','NFL.html','NBA.html','WNBA.html','NHL.html',
              'FIBA_Men.html','FIBA_Women.html','NCAA_Football.html','NCAA_Basketball.html',
              'UFC.html','Boxing.html','Tennis.html'
          ]
          refresh = '<script src="dailyrefresh.js"></script>'
          for name in pages:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              if refresh not in s:
                  marker = '<script src="ljapp.js"></script>'
                  if marker not in s:
                      raise SystemExit(f'{name}: ljapp marker missing')
                  s = s.replace(marker, refresh + marker, 1)
              if name == 'LJ_index.html' and '<script src="dailyrefresh_post.js"></script>' not in s:
                  s = s.replace('</body>', '<script src="dailyrefresh_post.js"></script></body>', 1)
              p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'Jordon Nesbitt'
          git config user.email '61303614+JordonNes@users.noreply.github.com'
          git add LJ_index.html MLB.html NFL.html NBA.html WNBA.html NHL.html FIBA_Men.html FIBA_Women.html NCAA_Football.html NCAA_Basketball.html UFC.html Boxing.html Tennis.html
          if git diff --cached --quiet; then
            echo 'Refresh layer already installed.'
            exit 0
          fi
          git commit -m 'Load current daily refresh overlay across L&J DP pages'
          git push origin HEAD:master
