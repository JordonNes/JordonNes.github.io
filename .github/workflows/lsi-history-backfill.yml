name: LSI Capacity-Aware History Backfill

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/lsi_history_backfill_step.py'
      - 'data/history_backfill_state.json'
      - '.github/workflows/lsi-history-backfill.yml'
  schedule:
    - cron: '30 5,11,17,23 * * *'

permissions:
  contents: write

concurrency:
  group: lsi-core-data-writer
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with: {ref: master, fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}

      - name: Advance bounded historical backfill
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            python scripts/lsi_history_backfill_step.py
          done

      - name: Refresh reusable LSI memory from new history
        run: |
          python scripts/lsi_history_warehouse.py
          python scripts/lsi_history_coverage.py
          python scripts/legz_statistical_spectrum.py
          python scripts/lsi_publish_future_board.py
          python scripts/lsi_t48_coverage.py
          python scripts/lsi_readiness_report.py

      - name: Commit incremental history progress
        shell: bash
        run: |
          git config user.name 'LEGZ-JINX LSI'
          git config user.email 'actions@users.noreply.github.com'
          git add data/history data/history_backfill_state.json data/history_coverage.json data/lsi_player_registry.json data/lsi_spectrum_cache.json data/qc_prop_board.json data/future_market_board.json data/future_market_board.js data/ljpc_coverage.json data/lsi_readiness.json
          if git diff --cached --quiet; then
            echo 'No new historical facts in this backfill cycle.'
            exit 0
          fi
          git commit -m "LSI capacity-aware historical backfill"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin master
            if git push origin master; then exit 0; fi
            sleep 3
          done
          exit 1
