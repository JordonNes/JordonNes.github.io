name: LSI Capacity-Aware History Backfill

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/lsi_history_backfill_step.py'
      - 'scripts/lsi_performance_ingest.py'
      - 'scripts/test_ncaa_history_team_filter.py'
      - 'scripts/lsi_history_warehouse.py'
      - 'scripts/legz_statistical_spectrum.py'
      - 'scripts/test_ncaa_history_continuity.py'
      - 'data/history_backfill_state.json'
      - '.github/workflows/lsi-history-backfill.yml'
  schedule:
    - cron: '30 5,11,17,23 * * *'

permissions:
  contents: write

concurrency:
  group: lsi-backfill-writer
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with: {ref: master, fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}

      - name: Verify NCAA current-enough history policy
        run: |
          python scripts/test_ncaa_history_continuity.py
          python scripts/test_ncaa_history_team_filter.py

      - name: Advance bounded historical backfill
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            python scripts/lsi_history_backfill_step.py
          done

      - name: Persist immutable history before derived-cache work
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LEGZ-JINX LSI'
          git config user.email 'actions@users.noreply.github.com'
          git add data/history data/history_backfill_state.json
          if git diff --cached --quiet; then
            echo 'No new immutable historical facts in this backfill cycle.'
          else
            git commit -m "LSI durable historical shard progress"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase --autostash origin master && git push origin master; then
                echo 'Immutable history/state safely persisted.'
                break
              fi
              git rebase --abort 2>/dev/null || true
              if [ "$attempt" -eq 5 ]; then
                echo '::error::Unable to persist immutable history/state.'
                exit 1
              fi
              sleep 3
            done
          fi

      - name: Refresh from master before derived-cache rebuild
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git reset --hard origin/master

      - name: Rebuild reusable history coverage and Spectrum cache
        run: |
          python scripts/lsi_history_coverage.py
          python scripts/lsi_history_warehouse.py

      - name: Persist derived history cache from fresh master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LEGZ-JINX LSI'
          git config user.email 'actions@users.noreply.github.com'

          rebuild_cache() {
            python scripts/lsi_history_coverage.py
            python scripts/lsi_history_warehouse.py
          }

          for attempt in 1 2 3; do
            git add data/history_coverage.json data/lsi_player_registry.json data/lsi_spectrum_cache.json
            if git diff --cached --quiet; then
              echo 'Derived history cache already current.'
              exit 0
            fi
            git commit -m "LSI rebuild durable history cache"
            if git push origin master; then
              exit 0
            fi

            echo "Derived-cache push raced master; rebuilding from fresh master (attempt $attempt/3)."
            git fetch origin master
            git reset --hard origin/master
            if [ "$attempt" -lt 3 ]; then
              rebuild_cache
            fi
          done
          echo '::error::Unable to persist derived history cache after fresh-master rebuilds.'
          exit 1
