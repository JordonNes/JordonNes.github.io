name: LSI NFL History Backfill

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Optional single NFL season year; blank refreshes current + previous'
        required: false
        type: string
  push:
    branches: [master]
    paths:
      - 'scripts/nflverse_history_backfill.py'
      - 'scripts/nflverse_history_backfill_step.py'
      - 'data/nfl_history_backfill_state.json'
      - '.github/workflows/lsi-nfl-history-backfill.yml'
  schedule:
    - cron: '15 10 * * *'

permissions:
  contents: write

concurrency:
  group: lsi-nfl-history-writer
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: {ref: master, fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}

      - name: Refresh durable NFL season shards
        shell: bash
        run: |
          if [ -n "${{ inputs.year }}" ]; then
            python scripts/nflverse_history_backfill.py --year "${{ inputs.year }}"
          else
            python scripts/nflverse_history_backfill.py
          fi

      - name: Advance two older NFL seasons
        continue-on-error: true
        run: |
          python scripts/nflverse_history_backfill_step.py
          python scripts/nflverse_history_backfill_step.py

      - name: Commit durable NFL history
        shell: bash
        run: |
          git config user.name 'LEGZ-JINX LSI'
          git config user.email 'actions@users.noreply.github.com'
          git add data/history/NFL data/nfl_history_backfill_state.json
          if git diff --cached --quiet; then
            echo 'NFL history shards already current.'
            exit 0
          fi
          git commit -m "LSI durable NFL history shard refresh"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin master
            if git push origin master; then exit 0; fi
            sleep 3
          done
          exit 1
