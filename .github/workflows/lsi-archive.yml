name: LSI Archive Memory Layer

on:
  push:
    branches: [master]
    paths:
      - 'scripts/lsi_archive.py'
      - 'data/results.csv'
      - 'data/settlement_status.json'
      - 'data/settlement_aliases.json'
      - 'data/lsi_evaluation_state.json'
      - '.github/workflows/lsi-archive.yml'
  workflow_run:
    workflows: ["LSI Daily Predictions Pipeline", "LSI Spectrum v3 Release"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '35 13 * * *'

permissions:
  contents: write

concurrency:
  group: lsi-archive-memory
  cancel-in-progress: true

jobs:
  archive:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout live LSI source
        uses: actions/checkout@v7
        with:
          ref: master
          path: source
          fetch-depth: 1

      - name: Checkout isolated archive branch
        uses: actions/checkout@v7
        with:
          ref: lsi-archive
          path: archive
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Sync archive branch
        shell: bash
        run: |
          cd archive
          git pull --ff-only origin lsi-archive

      - name: Capture immutable LSI memory
        run: |
          python source/scripts/lsi_archive.py \
            --source-root source \
            --archive-root archive/data/archive

      - name: Enforce live-site write isolation
        shell: bash
        run: |
          if [ -n "$(git -C source status --porcelain)" ]; then
            echo "::error::Archive process modified live source checkout."
            git -C source status --short
            exit 1
          fi
          OUTSIDE="$(git -C archive status --porcelain | grep -vE '^[ MARCUD?!]{2} data/archive/' || true)"
          if [ -n "$OUTSIDE" ]; then
            echo "::error::Archive process changed files outside data/archive."
            echo "$OUTSIDE"
            exit 1
          fi

      - name: Validate archive authority boundary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("archive/data/archive")
          health=json.loads((root/"archive_health.json").read_text(encoding="utf-8"))
          boundary=health["authority_boundary"]
          assert boundary["can_modify_live_predictions"] is False
          assert boundary["can_modify_live_pages"] is False
          assert boundary["can_change_confidence"] is False
          assert boundary["can_publish"] is False
          assert health["phase"] == "MEMORY_ONLY"
          for name in (
              "prediction_history.jsonl","context_history.jsonl",
              "event_history.jsonl","result_history.jsonl","settlement_history.jsonl","publication_history.jsonl",
              "evaluation_state_history.jsonl","entity_map.json","archive_health.json","archive_manifest.json"
          ):
              assert (root/name).exists(), name
          market_root=root/"market_history"
          assert market_root.exists(), "market_history directory missing"
          shards=list(market_root.rglob("*.jsonl"))
          assert shards, "market_history has no shards"
          oversize=[str(p) for p in shards if p.stat().st_size >= 90*1024*1024]
          assert not oversize, f"market shard(s) approaching GitHub size limit: {oversize}"
          eval_root=root/"evaluation_state_history"
          if eval_root.exists():
              eval_shards=list(eval_root.rglob("*.jsonl"))
              eval_oversize=[str(p) for p in eval_shards if p.stat().st_size >= 90*1024*1024]
              assert not eval_oversize, f"evaluation-state shard(s) approaching GitHub size limit: {eval_oversize}"
          else:
              eval_shards=[]
          print(f"Archive boundary validated; {len(shards)} market shards; {len(eval_shards)} evaluation-state shards; live publication remains independent.")
          PY

      - name: Commit archive-only changes
        shell: bash
        run: |
          cd archive
          git config user.name 'LEGZ-JINX LSI Archive'
          git config user.email 'actions@users.noreply.github.com'
          git add data/archive
          if git diff --cached --quiet; then
            echo 'No new archive observations.'
          else
            SOURCE_SHA="$(git -C ../source rev-parse --short HEAD)"
            git commit -m "LSI archive capture $SOURCE_SHA"
            git pull --rebase origin lsi-archive
            git push origin HEAD:lsi-archive
          fi
