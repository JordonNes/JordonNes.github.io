name: LSI Performance History Refresh

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/lsi_performance_ingest.py'
      - 'scripts/lsi_history_warehouse.py'
      - 'scripts/legz_statistical_spectrum.py'
      - '.github/workflows/lsi-performance-history.yml'
  schedule:
    - cron: '45 12 * * *'
    - cron: '45 6 * * *'

permissions:
  contents: write

concurrency:
  group: lsi-performance-history
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with: {ref: master, fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}

      - name: Ingest completed player-game facts once
        run: python scripts/lsi_performance_ingest.py --days-back 2 --max-events 80

      - name: Hydrate full NFL player history before current-POM evaluation
        continue-on-error: true
        run: python scripts/nfl_player_history_adapter.py

      - name: Refresh player registry and reusable spectrum cache
        run: python scripts/lsi_history_warehouse.py

      - name: Re-evaluate current POMs from local history
        run: python scripts/legz_statistical_spectrum.py

      - name: Publish future board and T-48 coverage
        run: |
          python scripts/lsi_publish_future_board.py
          python scripts/lsi_t48_coverage.py

      - name: Commit durable history and derived cache
        shell: bash
        run: |
          git config user.name 'LEGZ-JINX LSI'
          git config user.email 'actions@users.noreply.github.com'
          git add data/performance_history.csv data/lsi_player_registry.json data/lsi_spectrum_cache.json data/qc_prop_board.json data/future_market_board.json data/future_market_board.js data/ljpc_coverage.json
          if git diff --cached --quiet; then
            echo 'No new completed performance facts.'
            exit 0
          fi
          git commit -m "LSI incremental performance history refresh"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin master
            if git push origin master; then exit 0; fi
            sleep 3
          done
          exit 1
