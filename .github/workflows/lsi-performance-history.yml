name: LSI Performance History Refresh

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/lsi_performance_ingest.py'
      - 'scripts/nflverse_history_backfill.py'
      - 'scripts/lsi_history_warehouse.py'
      - 'scripts/legz_statistical_spectrum.py'
      - 'scripts/lsi_readiness_report.py'
      - '.github/workflows/lsi-performance-history.yml'
  schedule:
    - cron: '45 12 * * *'
    - cron: '45 6 * * *'

permissions:
  contents: write

concurrency:
  group: lsi-performance-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with: {ref: master, fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}

      - name: Ingest completed player-game facts once
        run: python scripts/lsi_performance_ingest.py --days-back 2 --max-events 80

      - name: Warm MLB forecast-first history for current POM evaluation
        run: python scripts/lsi_performance_ingest.py --days-back 28 --league MLB --max-events 450

      - name: Keep active CFB season history warm
        continue-on-error: true
        run: python scripts/lsi_performance_ingest.py --days-back 35 --league NCAA_Football --max-events 700

      - name: Commit durable history and derived cache
        shell: bash
        run: |
          git config user.name 'LEGZ-JINX LSI'
          git config user.email 'actions@users.noreply.github.com'
          git add data/performance_history.csv
          if git diff --cached --quiet; then
            echo 'No new completed performance facts.'
            exit 0
          fi
          git commit -m "LSI incremental performance history refresh"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin master
            if git push origin master; then exit 0; fi
            sleep 3
          done
          exit 1
