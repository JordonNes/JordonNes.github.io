name: FIBA Verified Fixture Sync
on:
  workflow_dispatch:
  schedule:
    - cron: '19 14,19 * * *'
  push:
    branches: [master]
    paths:
      - 'scripts/refresh_fiba_fixture_schedule.py'
      - 'scripts/test_fiba_fixture_refresh.py'
      - '.github/workflows/fiba-fixture-sync.yml'

permissions:
  contents: write

concurrency:
  group: fiba-verified-fixtures
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install FIBA parser dependency
        run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Check parser regressions
        run: python scripts/test_fiba_fixture_refresh.py
      - name: Verify upcoming matches against official FIBA schedules
        run: python scripts/refresh_fiba_fixture_schedule.py
      - name: Publish only official, successfully verified fixture changes
        run: |
          if git diff --quiet -- data/fiba_verified_fixtures.js; then
            echo "No changed official fixture snapshot."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fiba_verified_fixtures.js
          git commit -m "Refresh independently verified FIBA men/women schedules"
          # The LJDP market publisher also writes to master. A normal concurrent
          # update is not a failed FIBA fetch; replay this data-only commit safely.
          for attempt in 1 2 3 4; do
            git fetch origin master
            git rebase origin/master || { git rebase --abort; echo "Conflicting FIBA data update; no overwrite."; exit 1; }
            if git push origin HEAD:master; then exit 0; fi
            sleep 3
          done
          echo "Unable to push after concurrent updates; preserving repository state."
          exit 1
