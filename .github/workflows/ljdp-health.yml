name: LJDP Deployment Health

on:
  workflow_dispatch:
  schedule:
    - cron: '25 */3 * * *'
  workflow_run:
    workflows: ["LSI Daily Predictions Pipeline"]
    types: [completed]

permissions:
  contents: read

jobs:
  health:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: master}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate registry and publication wiring
        run: python scripts/validate_registry.py
      - name: Reject stale canonical predictions
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          d=json.load(open('data/prediction_registry.json'))
          stamp=datetime.fromisoformat(d['generated_at_utc'].replace('Z','+00:00'))
          age=(datetime.now(timezone.utc)-stamp).total_seconds()/3600
          print(f'Registry age: {age:.1f} hours')
          if age > 30: raise SystemExit('Prediction Registry is more than 30 hours old')
          PY
      - name: Validate ESPN sports-truth freshness
        run: |
          test -f data/espn_event_intelligence.json
          test -f data/espn_player_registry.json
          test -f data/espn_context.csv
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          event=json.load(open('data/espn_event_intelligence.json',encoding='utf-8'))
          players=json.load(open('data/espn_player_registry.json',encoding='utf-8'))
          assert event.get('schema_version')=='LSI-ESPN-EVENT-1'
          assert players.get('schema_version')=='LSI-ESPN-PLAYER-1'
          stamp=datetime.fromisoformat(event['generated_at_utc'].replace('Z','+00:00'))
          age=(datetime.now(timezone.utc)-stamp).total_seconds()/3600
          assert age <= 12, f'ESPN event intelligence stale: {age:.1f}h'
          assert 'never become LJPC' in event.get('policy','')
          print(f"ESPN sports-truth health: events={event.get('event_count',0)} players={players.get('player_count',0)} age={age:.2f}h errors={len(event.get('errors') or [])}")
          PY
      - name: Verify deployed Pages endpoints
        run: |
          set -euo pipefail
          wait_for_file_match() {
            local url="$1" local_path="$2" tmp_path="$3" label="$4"
            for attempt in $(seq 1 15); do
              if curl --fail --silent --show-error "$url?health_ts=$(date +%s)" -o "$tmp_path" && cmp --silent "$local_path" "$tmp_path"; then
                echo "$label matches master on attempt $attempt"
                return 0
              fi
              echo "Waiting for Pages propagation: $label attempt $attempt/15"
              sleep 15
            done
            echo "::error::Pages $label does not match master after propagation window"
            return 1
          }
          curl --fail --silent --show-error --retry 4 --retry-delay 10 https://jordonnes.github.io/LJ_index.html -o /tmp/ljdp.html
          curl --fail --silent --show-error --retry 4 --retry-delay 10 https://jordonnes.github.io/LJ_Methodology.html -o /tmp/methodology.html
          wait_for_file_match https://jordonnes.github.io/data/prediction_registry.json data/prediction_registry.json /tmp/registry.json "registry"
          wait_for_file_match https://jordonnes.github.io/data/settlement_status.json data/settlement_status.json /tmp/settlement.json "settlement status"
          wait_for_file_match https://jordonnes.github.io/data/future_market_board.json data/future_market_board.json /tmp/future.json "future market board"
          wait_for_file_match https://jordonnes.github.io/data/future_market_board.js data/future_market_board.js /tmp/future.js "future market board JS"
          wait_for_file_match https://jordonnes.github.io/data/current_game_moneylines.json data/current_game_moneylines.json /tmp/moneylines.json "GAME_ML artifact"
          wait_for_file_match https://jordonnes.github.io/data/espn_event_intelligence.json data/espn_event_intelligence.json /tmp/espn-events.json "ESPN event intelligence"
          test -s /tmp/future.json && test -s /tmp/future.js && test -s /tmp/moneylines.json
          grep -q 'LEGZ &amp; JINX — Daily Predictions' /tmp/ljdp.html
          grep -q 'provenance_policy' /tmp/registry.json
          grep -q 'LJPC = HIT PROBABILITY' /tmp/methodology.html
          ! grep -q 'confidence:m?Number(m\[1\]):60' lsi_registry_bridge.js || { echo '::error::Shared 60% LJPC fallback reintroduced'; exit 1; }
          ! grep -q 'PROVISIONAL LJPC' lsi_registry_bridge.js || { echo '::error::Market baseline mislabeled as LJPC'; exit 1; }
      - name: Validate deployed data semantics
        run: |
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          registry=json.load(open('/tmp/registry.json'))
          settlement=json.load(open('/tmp/settlement.json'))
          future=json.load(open('/tmp/future.json'))
          moneylines=json.load(open('/tmp/moneylines.json'))
          assert registry.get('schema_version')=='LSI-PR-2'
          assert settlement.get('schema_version')=='LSI-SETTLEMENT-1'
          assert future.get('schema_version')=='LJ-FUTURE-MARKET-1'
          assert moneylines.get('schema_version')=='LJ-CURRENT-GAME-ML-1'
          assert all(p.get('source_snapshot_ids') and p.get('provenance') and p.get('evidence_ids') for p in registry.get('predictions',[]))
          assert all(p.get('ljpc') is not None and p.get('legz_value') is not None and p.get('pom_value') is not None for p in registry.get('predictions',[]))
          now=datetime.now(timezone.utc)
          ml_stamp=datetime.fromisoformat(moneylines['generated_at_utc'].replace('Z','+00:00'))
          ml_age=(now-ml_stamp).total_seconds()/3600
          assert ml_age <= 8, f'GAME_ML artifact stale: {ml_age:.1f}h'
          usable_ml=[r for r in moneylines.get('rows',[]) if r.get('market_class')=='GAME_ML' and r.get('event_id') and r.get('participant') and r.get('price') not in (None,'')]
          assert usable_ml, 'No usable GAME_ML rows in deployed artifact'
          future_ids=set()
          for e in future.get('events',[]):
              if e.get('game_markets') and e.get('source_event_id'):
                  future_ids.add(str(e.get('source_event_id')))
              for row in e.get('game_markets') or []:
                  if row.get('event_id'):
                      future_ids.add(str(row.get('event_id')))
          current_ids={
              str(e.get('source_event_id')) for e in moneylines.get('events',[])
              if e.get('source_event_id')
              and e.get('commence_time')
              and datetime.fromisoformat(e['commence_time'].replace('Z','+00:00'))>now
          }
          missing=sorted(current_ids-future_ids)
          assert not missing, f'Deployed future board lost current GAME_ML event(s): {missing[:12]}'
          published_at=datetime.fromisoformat(future['generated_at_utc'].replace('Z','+00:00'))
          guard=future.get('publication_guard') or {}
          cutoff_raw=guard.get('cutoff_utc') or future['generated_at_utc']
          cutoff=datetime.fromisoformat(cutoff_raw.replace('Z','+00:00'))
          aged_out=[]
          for event in future.get('events',[]):
              start=datetime.fromisoformat(event['commence_time'].replace('Z','+00:00'))
              # Publication invariant: no event may already be started when a writer
              # emits the actionable future-board artifact. Events that start later
              # may naturally remain in static JSON until the next refresh; runtime
              # consumers must suppress those by current clock.
              assert start>cutoff, (
                  f"event was already started at publication cutoff: "
                  f"{event.get('source_event_id')} start={start.isoformat()} cutoff={cutoff.isoformat()}"
              )
              if start<=now:
                  aged_out.append(str(event.get('source_event_id') or event.get('event_id') or 'UNKNOWN'))
              for prop in event.get('props',[]):
                  assert prop.get('ljpc') is not None or prop.get('lj_confidence') is not None
                  assert prop.get('source_snapshot_ids')
          print(
              f"Deployed semantic health: {len(registry.get('predictions',[]))} predictions; "
              f"{len(future.get('events',[]))} published future events; {len(usable_ml)} GAME_ML rows; "
              f"moneyline age={ml_age:.2f}h; aged-out static rows hidden at runtime={len(aged_out)}"
          )
          if aged_out:
              print(f"Aged-out static future rows (runtime non-actionable): {aged_out[:20]}")
          PY
          grep -Fq 'if(!Number.isFinite(t)||t<=nowMs) return false;' lsi_registry_bridge.js || { echo '::error::Runtime DP/QC start-time gate missing'; exit 1; }
          grep -Fq 'if(!Number.isFinite(t)||t<=now||t>horizon)return;' Quickie_Generator.html || { echo '::error::Quickie start-time gate missing'; exit 1; }
