name: LSI Automatic Settlement

on:
  push:
    branches: [master]
    paths:
      - 'scripts/lsi_settle.py'
      - 'scripts/lsi_build_recaps.py'
      - 'scripts/lsi_suggestion_calibration.py'
      - 'data/suggestion_ledger.json'
      - 'data/fiba_competitions.js'
      - '.github/workflows/lsi-settlement.yml'
  workflow_run:
    workflows: ["LSI Publication Suggestion Ledger"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: lsi-automatic-settlement
  cancel-in-progress: false

jobs:
  settle:
    # Settlement is intentionally downstream of the committed publication ledger.
    # This avoids grading a stale ledger when prediction and ledger workflows run concurrently.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Settle completed LSI predictions
        run: python scripts/lsi_settle.py

      - name: Verify deterministic settlement rules
        run: python -m unittest scripts/test_lsi_settle.py

      - name: Build evidence-based recap data
        run: python scripts/lsi_build_recaps.py

      - name: Calibrate published LJPC and audit LEGZ vs JINX
        run: python scripts/lsi_suggestion_calibration.py

      - name: Validate settlement outputs
        shell: bash
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          status=json.loads(Path('data/settlement_status.json').read_text(encoding='utf-8'))
          aliases=json.loads(Path('data/settlement_aliases.json').read_text(encoding='utf-8'))
          assert status['schema_version']=='LSI-SETTLEMENT-1'
          assert status['influence_effect']=='NONE'
          assert isinstance(aliases.get('events'),dict)
          with open('data/results.csv',newline='',encoding='utf-8-sig') as fh:
              rows=list(csv.DictReader(fh))
          allowed={'WIN','LOSS','PUSH','VOID'}
          bad=[r for r in rows if r.get('grade') not in allowed]
          assert not bad, bad[:3]
          print(f"Settlement validation: {len(rows)} durable result rows; {len(aliases['events'])} resolved event aliases.")
          recap=Path('ljrecapdata.js').read_text(encoding='utf-8')
          assert 'LJ-RECAP-AUTO-3' in recap
          assert 'window.LJ_RECAP_DATA=' in recap
          assert 'MARKET ANOMALY' in Path('scripts/lsi_build_recaps.py').read_text(encoding='utf-8')
          ledger=Path('data/suggestion_ledger.json')
          if ledger.exists():
              l=json.loads(ledger.read_text(encoding='utf-8'))
              assert l.get('schema_version') in {'LSI-SUGGESTION-LEDGER-1','LSI-SUGGESTION-LEDGER-2'}
              accuracy=Path('data/suggestion_accuracy.json')
              assert accuracy.exists(), 'suggestion_accuracy.json missing after recap build'
              a=json.loads(accuracy.read_text(encoding='utf-8'))
              assert a.get('schema_version')=='LSI-SUGGESTION-ACCURACY-1'
              cal=json.loads(Path('data/ljpc_calibration.json').read_text(encoding='utf-8'))
              acct=json.loads(Path('data/legz_jinx_accountability.json').read_text(encoding='utf-8'))
              assert cal.get('schema_version')=='LSI-LJPC-CALIBRATION-1'
              assert acct.get('schema_version')=='LSI-LEGZ-JINX-ACCOUNTABILITY-1'
          PY

      - name: Commit settlement-only outputs
        shell: bash
        run: |
          ALLOWED='data/results.csv data/settlement_status.json data/settlement_aliases.json data/suggestion_accuracy.json data/ljpc_calibration.json data/legz_jinx_accountability.json ljrecapdata.js'
          CHANGED="$(git status --porcelain | awk '{print $2}')"
          for f in $CHANGED; do
            case " $ALLOWED " in
              *" $f "*) ;;
              *) echo "::error::Settlement changed unauthorized path: $f"; exit 1;;
            esac
          done
          git config user.name 'LEGZ-JINX LSI Settlement'
          git config user.email 'actions@users.noreply.github.com'
          git add $ALLOWED
          if git diff --cached --quiet; then
            echo 'No settlement changes.'
          else
            git commit -m "LSI automatic settlement"
            git pull --rebase origin master
            git push origin master
          fi
