name: D&G Cloudflare Worker Deploy
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'cloudflare/dg-market-api/**'
      - '.github/workflows/dg-cloudflare-deploy.yml'
permissions:
  contents: read
jobs:
  deploy:
    if: ${{ vars.DG_CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Worker (account-level token must be configured)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/dg-market-api
          command: deploy
      - name: Verify shared KV batch endpoint
        run: |
          node --input-type=module <<'NODE'
          const endpoint = "https://dg-market-intelligence.jordonnes-markets.workers.dev/api/crypto-event-targets-batch";
          const response = await fetch(endpoint, { headers: { Accept: "application/json" } });
          if (!response.ok) throw new Error(`Batch endpoint returned HTTP ${response.status}`);
          const payload = await response.json();
          if (payload.shared_kv_configured !== true) throw new Error("DG_ARCHIVE is not configured on the live Worker");
          const expected = ["BTC", "ETH", "SOL", "XRP", "HYPE"];
          const assets = payload.assets && typeof payload.assets === "object" ? Object.keys(payload.assets) : [];
          const missing = expected.filter((asset) => !assets.includes(asset));
          if (missing.length) throw new Error(`Batch response missing assets: ${missing.join(", ")}`);
          const states = Object.fromEntries(expected.map((asset) => [asset, payload.assets[asset]?.state || "UNKNOWN"]));
          const sawRateLimit = expected.some((asset) => ["RATE_LIMITED", "STALE_DURING_RATE_LIMIT"].includes(states[asset]));
          const repeatResponse = await fetch(endpoint, { headers: { Accept: "application/json" } });
          if (!repeatResponse.ok) throw new Error(`Repeat batch endpoint returned HTTP ${repeatResponse.status}`);
          const repeatPayload = await repeatResponse.json();
          if (repeatPayload.shared_kv_configured !== true) throw new Error("DG_ARCHIVE was not configured on repeat request");
          const repeatStates = Object.fromEntries(expected.map((asset) => [asset, repeatPayload.assets?.[asset]?.state || "UNKNOWN"]));
          if (sawRateLimit && expected.some((asset) => !["RATE_LIMITED", "STALE_DURING_RATE_LIMIT"].includes(repeatStates[asset]))) {
            throw new Error(`Shared 429 cooldown was not applied consistently: ${JSON.stringify(repeatStates)}`);
          }
          console.log(JSON.stringify({ shared_kv_configured: true, assets, states, repeat_states: repeatStates, cooldown_checked: sawRateLimit, retrieved_at_utc: repeatPayload.retrieved_at_utc }));
          NODE
