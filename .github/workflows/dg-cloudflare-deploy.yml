name: D&G Cloudflare Worker Deploy
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'cloudflare/dg-market-api/**'
      - '.github/workflows/dg-cloudflare-deploy.yml'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /cloudflare/dg-market-api/
            /damilola-gavavi/
          sparse-checkout-cone-mode: false
      - name: Confirm Cloudflare deployment credentials
        env:
          CF_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_DEPLOY_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -z "$CF_DEPLOY_TOKEN" || -z "$CF_DEPLOY_ACCOUNT" ]]; then
            echo "::error title=Cloudflare credentials missing::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets so D&G Worker can deploy automatically."
            exit 1
          fi
      - name: Test private portfolio and prepare isolated private storage
        env:
          CF_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_DEPLOY_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --test damilola-gavavi/portfolio-stake-profile.test.cjs damilola-gavavi/phase-2.test.cjs damilola-gavavi/phase-2-match.test.cjs
          node --input-type=module <<'NODE'
          const base='https://api.cloudflare.com/client/v4/accounts/'+process.env.CF_DEPLOY_ACCOUNT+'/r2/buckets';
          const name='dg-private-portfolio';
          async function call(path,method='GET',body){
            const r=await fetch(base+path,{method,headers:{Authorization:'Bearer '+process.env.CF_DEPLOY_TOKEN,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(30000)});
            const data=await r.json();return {ok:r.ok&&data.success,status:r.status,result:data.result,errors:data.errors?.map(x=>x.code)};
          }
          let bucket=await call('/'+name);
          if(!bucket.ok&&bucket.status===404)bucket=await call('','POST',{name});
          if(!bucket.ok)throw Error('Private portfolio bucket setup failed: '+JSON.stringify({status:bucket.status,codes:bucket.errors}));
          const managed=await call('/'+name+'/domains/managed');
          const custom=await call('/'+name+'/domains/custom');
          if(!managed.ok||!custom.ok)throw Error('Cannot verify private bucket access settings. Deployment stopped.');
          if(managed.result.enabled!==false||(custom.result.domains||[]).some(d=>d.enabled))throw Error('Portfolio bucket has public access. Deployment stopped.');
          console.log('Private portfolio storage verified: public access disabled.');
          NODE
      - name: Deploy Worker (account-level token must be configured)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/dg-market-api
          command: deploy
      - name: Verify active 15-minute Worker and supplementary routes
        run: |
          node --input-type=module <<'NODE'
          const root="https://dg-market-intelligence.jordonnes-markets.workers.dev";
          async function check(path) {
            let res;
            for(let attempt=0;attempt<4;attempt++){
              res=await fetch(root+path,{headers:{Accept:"application/json"},signal:AbortSignal.timeout(30000)});
              if(res.status!==404||attempt===3)break;
              await new Promise(resolve=>setTimeout(resolve,2000));
            }
            let body;try{body=await res.json()}catch{throw Error(path+" non-JSON response "+res.status)}
            return {status:res.status,cache:res.headers.get("X-DG-Cache"),body};
          }
          const providerWarnings=[];
          for(const symbol of ["BTC-USD","ETH-USD","SOL-USD"]){
            const path="/api/coinbase-advanced-reference?symbol="+symbol;
            const first=await check(path),second=await check(path);
            if([first,second].some(r=>r.status===503&&r.body.error==="coinbase_unavailable"&&r.body.upstream_status===429)){
              providerWarnings.push("Coinbase rate-limited "+symbol);
              console.warn("::warning title=Coinbase upstream 429::"+symbol+" temporarily rate-limited; Worker remains deployed.");
              continue;
            }
            for(const r of [first,second])if(r.status!==200||r.body.symbol!==symbol||!(Number(r.body.price_usd)>0)||r.body.read_only!==true||r.body.execution_ready!==false)throw Error("Coinbase route failed: "+symbol+" "+JSON.stringify(r));
            if(second.cache!=="HIT")throw Error("Coinbase cache not verified: "+symbol+" "+second.cache);
            console.log(JSON.stringify({cache:second.cache,coinbase_symbol:symbol,price_usd:second.body.price_usd,retrieved_at_utc:second.body.retrieved_at_utc,read_only:true}));
          }
          const locked=await check("/api/private/portfolio");
          if(locked.status!==401||locked.body.state!=="LOCKED")throw Error("Private portfolio access control failed");
          const publicPortfolio=await check("/api/public/portfolio");
          if(publicPortfolio.status!==200||publicPortfolio.body.state!=="PUBLIC_OBSERVED_PORTFOLIO"||
             publicPortfolio.body.read_only!==true||publicPortfolio.body.trading_enabled!==false||
             !Array.isArray(publicPortfolio.body.positions)||!publicPortfolio.body.snapshot_complete)
            throw Error("Public Portfolio not available with complete read-only snapshot: "+JSON.stringify({
             status:publicPortfolio.status,state:publicPortfolio.body.state}));
          const exposed=JSON.stringify(publicPortfolio.body);
          for(const secret of ['private_api_key','KALSHI_PRIVATE_KEY','KALSHI_API_KEY_ID','fill_id','exchange_index','account_id'])
            if(exposed.includes('"'+secret+'"'))throw Error("Public Portfolio leaks private field: "+secret);
          if(publicPortfolio.body.snapshot_stale)console.warn("::warning title=Public Portfolio stale::Account snapshot is older than three minutes.");
          console.log(JSON.stringify({public_portfolio:publicPortfolio.body.state,
           open_positions:publicPortfolio.body.positions.length,snapshot_stale:publicPortfolio.body.snapshot_stale}));
          const audit=await check("/api/intelligence-report?series=KXBTC15M");
          if(audit.status!==200||!['OBSERVED_REPORT','NO_DAILY_REVIEW','INSUFFICIENT_ARCHIVE'].includes(audit.body.state)||
             audit.body.trading_enabled!==false||audit.body.read_only!==true)
             throw Error("Intelligence Audit endpoint unavailable: "+JSON.stringify({status:audit.status,state:audit.body.state}));
          if(audit.body.state!=="OBSERVED_REPORT")
            console.warn("::warning title=No historical evidence yet::Damilola audit reported "+audit.body.state);
          console.log(JSON.stringify({intelligence_audit:audit.body.state,observed_contracts:audit.body.archive?.observed_contracts??null,
           validated_edge:audit.body.validation?.predictive_edge_verified??false}));
          const dailyStatus=await check("/api/damilola-status");
          if(dailyStatus.status!==200||dailyStatus.body.r2_configured!==true)
            throw Error("Damilola historical review status route missing R2 connection.");

          const status=await check("/api/kalshi-status");
          if(status.status!==200||status.body.read_only!==true||typeof status.body.cooldown_active!=="boolean")throw Error("Kalshi diagnostics unavailable");
          const signalLedger=await check("/api/damilola-signal-ledger?series=KXBTC15M&limit=1");
          if(signalLedger.status!==200||signalLedger.body.state!=="OBSERVED_LEDGER"||
             signalLedger.body.read_only!==true||signalLedger.body.trading_enabled!==false||
             !Array.isArray(signalLedger.body.rows)||signalLedger.body.rows.length!==1)
            throw Error("Damilola prospective signal ledger unavailable: "+JSON.stringify(signalLedger));
          console.log(JSON.stringify({damilola_signal_ledger:signalLedger.body.state,
            first_eligible_calls:signalLedger.body.summary?.first_eligible_calls,
            recording_mode:"FIXED_CHECKPOINTS_ONLY",trading_enabled:false}));
          const ledger=await check("/api/prediction-ledger?series=KXBTC15M&mode=read");
          if(ledger.status!==200||ledger.body.read_only!==true||ledger.body.trading_enabled!==false||!["RECORDED","NO_RECORD"].includes(ledger.body.state))throw Error("Prospective ledger unavailable: "+JSON.stringify(ledger));
          console.log(JSON.stringify({prediction_ledger:ledger.body.state,trading_enabled:false}));
          const alias=await check("/api/coinbase-advanced-reference?symbol=BTC");
          if(alias.status===503&&alias.body.error==="coinbase_unavailable"&&alias.body.upstream_status===429){
            providerWarnings.push("Coinbase alias rate-limited");
            console.warn("::warning title=Coinbase upstream 429::BTC shorthand temporarily rate-limited.");
          }else if(alias.status!==200||alias.body.symbol!=="BTC-USD")throw Error("Coinbase shorthand failed");
          const hour=Math.floor(Date.now()/3600000)*3600-3600;
          const layers=await check("/api/market-layers?series=KXBTC15M&hour="+hour);
          if(layers.status!==200||layers.body.read_only!==true||layers.body.underlying_price_history!==false||!Array.isArray(layers.body.contracts)||!layers.body.contracts.length)throw Error("Pattern Lab source verification failed: "+JSON.stringify(layers));
          console.log(JSON.stringify({pattern_lab_state:layers.body.state,contracts:layers.body.contracts_returned,archive:layers.body.archive_state}));
          const batch=await check("/api/quarter-hour-batch?series=KXBTC15M,KXGOLD15M");
          if(batch.status!==200||batch.body.kind!=="QUARTER_HOUR_BATCH"||batch.body.shared_kv_configured!==true)throw Error("Active quarter-hour batch or shared KV missing");
          for(const series of ["KXBTC15M","KXGOLD15M"])if(!batch.body.results?.[series])throw Error("Missing "+series+" batch record");
          console.log(JSON.stringify({kalshi_status:status.body,kalshi_markets:Object.fromEntries(Object.entries(batch.body.results).map(([k,v])=>[k,{http_status:v.http_status,state:v.payload?.state,retry_at_utc:v.payload?.retry_at_utc??null,markets:v.payload?.markets?.length??0}]))}));
          const kraken=await check("/api/kraken-reference?symbol=BTC");
          // Upstream availability is not under our control; endpoint MUST return a defined provider state.
          if(kraken.status===200 && !(kraken.body.state==="OBSERVED"&&kraken.body.provider==="kraken"&&kraken.body.price>0))throw Error("Invalid Kraken observation");
          if(kraken.status!==200 && !(kraken.status===503&&["RATE_LIMITED","UPSTREAM_UNAVAILABLE","INVALID_SOURCE","UNEXPECTED_PAIR_COUNT","INVALID_PRICE","FETCH_FAILED"].includes(kraken.body.state)))throw Error("Kraken route unavailable or unexpected schema: "+JSON.stringify(kraken));
          const td=await check("/api/twelvedata-reference?symbol=EUR%2FUSD");
          if(td.status!==403 && td.status!==503 && td.status!==200)throw Error("Unexpected Twelve Data response "+td.status);
          if(td.status===403&&td.body.state!=="DISPLAY_LICENSE_NOT_VERIFIED")throw Error("Unexpected Twelve Data access denial");
          const taapi=await check("/api/taapi-status");
          if(taapi.status!==200||!Array.isArray(taapi.body.feeds)||taapi.body.feeds.length!==6||typeof taapi.body.kv_configured!=="boolean")throw Error("TAAPI audit route unavailable or invalid schema");
          console.log(JSON.stringify({taapi_audit_route:true,last_taapi_run:taapi.body.last_run?.state||"unverified",r2_configured:taapi.body.r2_configured}));
          const retired=await check("/api/kalshi");
          if(retired.status!==410||retired.body.error!=="route_out_of_scope")throw Error("Retired route inadvertently reenabled");
          console.log(JSON.stringify({quarter_hour:batch.body.kind,shared_kv:true,kraken_status:kraken.status,kraken_state:kraken.body.state,twelvedata_status:td.status,twelvedata_state:td.body.state,retired_route:retired.status}));
          if(providerWarnings.length)console.warn("::warning title=Upstream degradation::"+providerWarnings.join("; "));
          NODE
