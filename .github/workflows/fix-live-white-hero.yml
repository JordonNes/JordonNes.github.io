name: Final L&J Live white background

on:
  push:
    paths:
      - '.github/workflows/fix-live-white-hero.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final white Live background
        run: python .github/scripts/fix_live_white_hero.py
      - name: Commit final white Live background
        run: |
          git config user.name 'L&J Site Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add ljlivepred_app.js live/live.css
          if git diff --cached --quiet; then
            echo 'Final L&J Live white background already applied.'
            exit 0
          fi
          git commit -m 'Lock white background across all L&J Live pages and headers'
          git push origin HEAD:master
