name: RWT Pages Release Sync
# Avoid Pages cancellations from frequent master data commits.
# Fast-forward a stable Pages publishing branch every 15 minutes.
on:
  push:
    branches: [master]
    paths: ['_config.yml', 'NBA.html', 'FIBA.html', 'nba_live_qc.js', 'fiba_live_qc.js', 'data/fiba_verified_fixtures.js', '.github/workflows/rwt-pages-release-sync.yml']
  workflow_run:
    workflows: ["LSI Daily Predictions Pipeline", "LSI Game Winner Refresh", "LSI Spectrum v3 Release", "pages build and deployment"]
    types: [completed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: rwt-pages-release-sync
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Update release branch using GitHub refs API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          # Let the current Pages release finish before moving its source ref.
          # A later completion event (or scheduled sync) publishes any newer head.
          active="$(gh api "repos/$repo/actions/runs?branch=rwt-pages-release&per_page=30" --jq '[.workflow_runs[] | select(.name == "pages build and deployment" and (.status == "queued" or .status == "in_progress" or .status == "waiting"))] | length')"
          if [ "$active" -gt 0 ]; then
            echo "Pages deployment active; preserving its immutable release snapshot."
            exit 0
          fi
          source_sha="$(gh api "repos/$repo/git/ref/heads/master" --jq '.object.sha')"
          release_sha="$(gh api "repos/$repo/git/ref/heads/rwt-pages-release" --jq '.object.sha')"
          if [ "$source_sha" = "$release_sha" ]; then
            echo "No new commits to publish."
            exit 0
          fi
          gh api --method PATCH "repos/$repo/git/refs/heads/rwt-pages-release" -f sha="$source_sha" -F force=false >/dev/null
          echo "Release snapshot advanced to $source_sha"
