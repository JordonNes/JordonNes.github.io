name: RWT Pages Release Sync
# Avoid Pages cancellations from frequent master data commits.
# Fast-forward a stable Pages publishing branch every 15 minutes.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rwt-pages-release-sync
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Update release branch using GitHub refs API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          source_sha="$(gh api "repos/$repo/git/ref/heads/master" --jq '.object.sha')"
          release_sha="$(gh api "repos/$repo/git/ref/heads/rwt-pages-release" --jq '.object.sha')"
          if [ "$source_sha" = "$release_sha" ]; then
            echo "No new commits to publish."
            exit 0
          fi
          gh api --method PATCH "repos/$repo/git/refs/heads/rwt-pages-release" -f sha="$source_sha" -F force=false >/dev/null
          echo "Release snapshot advanced to $source_sha"
