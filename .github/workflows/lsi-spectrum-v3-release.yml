name: LSI Spectrum v3 Release

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/lsi-spectrum-v3-release.yml'
      - 'scripts/legz_statistical_spectrum.py'
      - 'scripts/legz_prop_ladder_test.py'
      - 'scripts/lsi_apply_verified_overrides.py'
      - 'data/verified_market_overrides.json'
      - 'data/fiba_scenario_state.json'
      - 'data/lsi_spectrum_cache.json'
      - 'scripts/lsi_pipeline.py'
      - 'scripts/lsi_publish_future_board.py'
      - 'Quickie_Generator.html'
      - 'lsi_registry_bridge.js'

permissions:
  contents: write

concurrency:
  group: lsi-spectrum-v3-release
  cancel-in-progress: true

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: {ref: master, fetch-depth: 0}
      - uses: actions/setup-node@v6
        with: {node-version: '22'}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}

      - name: Validate Quickie inline JavaScript
        run: |
          python - <<'PY'
          import re, pathlib
          html=pathlib.Path('Quickie_Generator.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',html,re.S|re.I)
          assert blocks, 'No inline Quickie JavaScript found'
          pathlib.Path('/tmp/quickie-inline.js').write_text(chr(10).join(blocks),encoding='utf-8')
          print(f'Quickie inline JS blocks: {len(blocks)}')
          PY
          node --check /tmp/quickie-inline.js

      - name: Merge verified override evidence
        run: python scripts/lsi_apply_verified_overrides.py

      - name: Generate LEGZ Synthetic Book fallback
        run: python scripts/legz_synthetic_book.py

      - name: Validate forecast-first player-prop ladder
        run: python scripts/legz_prop_ladder_test.py

      - name: Execute Spectrum v3 from durable cache
        env:
          LSI_FAST_RUNTIME: 'true'
        run: python scripts/legz_statistical_spectrum.py

      - name: Validate durable evaluation ledger
        run: |
          python - <<'PY'
          import json
          board=json.load(open('data/qc_prop_board.json',encoding='utf-8'))
          state=json.load(open('data/lsi_evaluation_state.json',encoding='utf-8'))
          assert board.get('evaluation_engine')=='LEGZ_STATISTICAL_SPECTRUM_3'
          assert state.get('schema_version')=='LSI-EVALUATION-STATE-1'
          props=[p for e in board.get('events',[]) for p in (e.get('props') or [])]
          ids={r.get('evaluation_id') for r in state.get('records',[]) if r.get('evaluation_id')}
          assert props, 'QC prop board has no props to evaluate'
          assert all(p.get('evaluation_id') and p.get('evaluation_material_hash') and p.get('feature_state') for p in props)
          assert all(p.get('evaluation_id') in ids for p in props)
          evaluated=[p for p in props if p.get('evaluation_status')=='LJ_EVALUATED']
          waiting=[p for p in props if p.get('evaluation_status')=='AWAITING_LJ_EVALUATION']
          assert all(p.get('ljpc') is not None for p in evaluated)
          assert all(p.get('ljpc') is None for p in waiting)
          import os
          size=os.path.getsize('data/lsi_evaluation_state.json')
          assert state.get('retention_policy')=='LIVE_CURRENT_BOARD_RECORDS_PLUS_LATEST_HASH_INDEX'
          assert size < 80*1024*1024, f'Live evaluation state too large: {size/1024/1024:.2f} MB'
          assert state.get('record_count')==len(state.get('records') or [])
          print(f'Spectrum v3 ledger valid: props={len(props)} evaluated={len(evaluated)} awaiting={len(waiting)} states={len(ids)} size_mb={size/1024/1024:.2f}')
          PY

      - name: Explain forecast-first projection gaps
        run: python scripts/lsi_projection_gap_report.py

      - name: Build canonical Prediction Registry
        run: python scripts/lsi_pipeline.py

      - name: Publish future board
        run: python scripts/lsi_publish_future_board.py

      - name: Restore evaluated Game Winners after board rebuild
        run: python scripts/lsi_game_winner_spectrum.py

      - name: Validate downstream parity
        run: |
          python - <<'PY'
          import json
          board=json.load(open('data/qc_prop_board.json',encoding='utf-8'))
          reg=json.load(open('data/prediction_registry.json',encoding='utf-8'))
          future=json.load(open('data/future_market_board.json',encoding='utf-8'))
          synthetic=json.load(open('data/legz_synthetic_book.json',encoding='utf-8'))
          required={'evaluation_key','evaluation_id','evaluation_material_hash','evaluation_version','evaluated_at_utc','player_projection','feature_state','spectrum','evaluation_reason'}
          fields=set(reg.get('player_prop_fields') or [])
          assert required <= fields, sorted(required-fields)
          assert reg.get('evaluation_state_policy')
          qids={p.get('evaluation_id') for e in board.get('events',[]) for p in (e.get('props') or []) if p.get('evaluation_id')}
          rprops=[p for p in reg.get('predictions',[]) if p.get('market_class')=='PLAYER_PROP']
          matched=[p for p in rprops if p.get('evaluation_id')]
          assert all(p.get('evaluation_id') in qids for p in matched)
          future_props=[p for e in future.get('events',[]) for p in (e.get('props') or e.get('player_props') or [])]
          synthetic_props=[p for e in synthetic.get('events',[]) for p in (e.get('props') or [])]
          evaluated_synthetic=[p for p in synthetic_props if p.get('synthetic') and p.get('evaluation_status')=='LJ_EVALUATED' and p.get('ljpc') is not None]
          durable_eval=[p for e in board.get('events',[]) for p in (e.get('props') or []) if p.get('evaluation_status')=='LJ_EVALUATED' and p.get('ljpc') is not None]
          # Free-first operation may intentionally publish zero actionable future-board
          # props when no live market feed is available. In that case the browser bridge
          # must render durable evaluated QC inventory as LINE RECHECK REQUIRED.
          assert future_props or durable_eval, 'No current or durable evaluated player-prop inventory exists'
          assert all(p.get('evaluation_id') and p.get('evaluation_material_hash') and p.get('feature_state') for p in future_props)
          evaluated_future=[p for p in future_props if p.get('evaluation_status')=='LJ_EVALUATED' and p.get('ljpc') is not None]
          assert all(p.get('player_projection') for p in evaluated_future), 'Public LJ_EVALUATED prop missing player_projection'
          summary=board.get('projection_summary') or {}
          print('Projection coverage:',summary)
          if synthetic_props:
              assert synthetic.get('stage')=='POST_SPECTRUM_EVALUATED', synthetic.get('stage')
              assert evaluated_synthetic, 'Synthetic research book exists but contains zero post-Spectrum internal evaluations'
          published_synthetic=[p for p in future_props if p.get('synthetic') or p.get('model_generated') or p.get('market_verification')=='LEGZ_SYNTHETIC_NOT_EXTERNAL_OFFER']
          assert not published_synthetic, f'Synthetic/model-target POM escaped into public future board: {len(published_synthetic)}'
          print(f'Downstream parity valid: registry_props={len(rprops)} canonical_matches={len(matched)} future_eval_props={len(future_props)} projected_future_eval={len(evaluated_future)} durable_eval_props={len(durable_eval)} internal_synthetic_eval={len(evaluated_synthetic)} public_synthetic=0')
          PY

      - name: Commit Spectrum v3 release artifacts
        shell: bash
        run: |
          git config user.name 'LEGZ-JINX LSI'
          git config user.email 'actions@users.noreply.github.com'
          outputs=(
            data/qc_prop_board.json data/lsi_evaluation_state.json data/legz_synthetic_book.json
            data/prediction_registry.json data/prediction_registry.js
            data/future_market_board.json data/future_market_board.js
            data/game_winner_evidence.json data/projection_gap_report.json
          )
          snapshot="$(mktemp -d)"
          for p in "${outputs[@]}"; do
            if [ -e "$p" ]; then
              mkdir -p "$snapshot/$(dirname "$p")"
              cp -a "$p" "$snapshot/$p"
            fi
          done

          # Generated runtime artifacts are authoritative for this run; current
          # master is authoritative for code/UI and unrelated projects. Never
          # rebase multi-megabyte generated JSON against a moving branch.
          for attempt in 1 2 3 4 5; do
            git fetch origin master
            git reset --hard origin/master
            for p in "${outputs[@]}"; do
              if [ -e "$snapshot/$p" ]; then
                rm -rf "$p"
                mkdir -p "$(dirname "$p")"
                cp -a "$snapshot/$p" "$p"
              fi
            done
            git add "${outputs[@]}" 2>/dev/null || true
            if git diff --cached --quiet; then
              echo 'Spectrum v3 artifacts already current.'
              exit 0
            fi
            git commit -m 'LSI Spectrum v3 runtime release'
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "Push race detected; refreshing master and re-overlaying Spectrum artifacts (${attempt}/5)."
            sleep 3
          done
          echo "::error::Unable to publish Spectrum v3 artifacts after 5 overlay retries."
          exit 1
