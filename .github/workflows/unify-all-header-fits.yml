name: Apply unified L&J header image corrections

on:
  push:
    paths:
      - '.github/workflows/unify-all-header-fits.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply unified header corrections
        run: python .github/scripts/unify_all_header_fits.py
      - name: Commit header corrections
        run: |
          git config user.name 'L&J Site Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add ljstyle.css recaplink.js ljlivepred_app.js live/live.css assets/ljpd-recap-loader.js
          if git diff --cached --quiet; then
            echo 'Unified header corrections already applied.'
            exit 0
          fi
          git commit -m 'Unify full-image header fit across DP Live Recap and general pages'
          git push origin HEAD:master
