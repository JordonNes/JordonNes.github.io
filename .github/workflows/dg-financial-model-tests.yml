name: D&G Financial Model Tests
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'damilola-gavavi/dg-net-opportunity.js'
      - 'damilola-gavavi/dg-net-opportunity.test.cjs'
      - 'damilola-gavavi/dg-walk-forward.js'
      - 'damilola-gavavi/dg-walk-forward.test.cjs'
      - 'damilola-gavavi/dg-15m-calibration.js'
      - 'damilola-gavavi/dg-15m-independent-audit.js'
      - 'damilola-gavavi/dg-15m-independent-audit.test.cjs'
      - 'damilola-gavavi/dg-15m-calibration.test.cjs'
      - 'damilola-gavavi/dg-15m-kalshi-schema.test.cjs'
      - 'damilola-gavavi/dg-15m-fee-metadata.test.cjs'
      - 'cloudflare/dg-market-api/src/quarter-hour-fees.js'
      - 'cloudflare/dg-market-api/src/quarter-hour-training.js'
      - 'cloudflare/dg-market-api/src/kalshi-public-cache.js'
      - 'cloudflare/dg-market-api/src/kalshi-read-auth.js'
      - 'damilola-gavavi/dg-kalshi-shared-cache.test.cjs'
      - 'damilola-gavavi/dg-15m-economics.js'
      - 'damilola-gavavi/dg-15m-economics.test.cjs'
      - 'damilola-gavavi/dg-quarter-hour-math.js'
      - 'damilola-gavavi/dg-quarter-hour-math.test.cjs'
      - 'damilola-gavavi/index.html'
      - 'damilola-gavavi/gavavi-live.html'
      - 'damilola-gavavi/gam-15m.css'
      - 'damilola-gavavi/gam-15m.js'
      - 'damilola-gavavi/gam-15m-ui.test.cjs'
      - 'damilola-gavavi/card-history.test.cjs'
      - 'cloudflare/dg-market-api/src/card-history.js'
      - 'damilola-gavavi/dg-model-release*'
      - 'damilola-gavavi/dg-feature-candidate*'
      - 'damilola-gavavi/dg-early-exit*'
      - 'damilola-gavavi/exit-lab*'
      - 'scripts/build-dg-early-exit.mjs'
      - 'scripts/build-dg-feature-candidate.mjs'
      - 'scripts/build-dg-model-release.mjs'
      - 'damilola-gavavi/prediction-ledger.test.cjs'
      - 'cloudflare/dg-market-api/src/prediction-ledger.js'
      - 'damilola-gavavi/pattern-*'
      - 'cloudflare/dg-market-api/src/market-layers.js'
      - 'cloudflare/dg-market-api/src/supplementary-reference.js'
      - 'cloudflare/dg-market-api/src/quarter-hour.js'
      - 'cloudflare/dg-market-api/src/coinbase-advanced-reference.js'
      - 'damilola-gavavi/dg-coinbase-reference.test.cjs'
      - '.github/workflows/dg-financial-model-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test financial calculations and historical walk-forward gates
        run: node --test damilola-gavavi/card-history.test.cjs damilola-gavavi/dg-early-exit.test.cjs damilola-gavavi/dg-feature-candidate.test.cjs damilola-gavavi/dg-model-release.test.cjs damilola-gavavi/prediction-ledger.test.cjs damilola-gavavi/pattern-lab.test.cjs damilola-gavavi/dg-coinbase-reference.test.cjs damilola-gavavi/gam-15m-ui.test.cjs damilola-gavavi/dg-kalshi-shared-cache.test.cjs damilola-gavavi/dg-15m-independent-audit.test.cjs damilola-gavavi/dg-15m-calibration.test.cjs damilola-gavavi/dg-15m-economics.test.cjs damilola-gavavi/dg-15m-fee-metadata.test.cjs damilola-gavavi/dg-15m-kalshi-schema.test.cjs damilola-gavavi/dg-net-opportunity.test.cjs damilola-gavavi/dg-walk-forward.test.cjs damilola-gavavi/dg-quarter-hour-math.test.cjs

