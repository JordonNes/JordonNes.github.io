name: FIBA Game QC Release Gate

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'FIBA.html'
      - 'fiba_live_qc.js'
      - 'fiba_hub.js'
      - 'data/fiba_verified_fixtures.js'
      - 'scripts/test_fiba_live_qc.js'
      - 'scripts/refresh_fiba_fixture_schedule.py'
      - 'scripts/test_fiba_fixture_refresh.py'
      - '.github/workflows/fiba-live-qc-ci.yml'

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout: |
            FIBA.html
            fiba_live_qc.js
            data/fiba_verified_fixtures.js
            scripts/test_fiba_live_qc.js
            scripts/refresh_fiba_fixture_schedule.py
            scripts/test_fiba_fixture_refresh.py
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify FIBA JavaScript syntax
        run: |
          node --check fiba_live_qc.js
          node --check data/fiba_verified_fixtures.js
          node --check scripts/test_fiba_live_qc.js
      - name: Verify 20 Piece + per-game QC gates
        run: node scripts/test_fiba_live_qc.js
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify official schedule parsing
        run: |
          python -m pip install 'beautifulsoup4>=4.12,<5'
          python scripts/test_fiba_fixture_refresh.py
