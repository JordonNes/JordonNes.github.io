name: Apply global L&J header fit

on:
  push:
    paths:
      - '.github/workflows/global-header-fit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply global header fit
        run: python .github/scripts/global_header_fit.py
      - name: Commit global correction
        run: |
          git config user.name 'L&J Site Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add ljstyle.css
          if git diff --cached --quiet; then
            echo 'Global header correction already applied.'
            exit 0
          fi
          git commit -m 'Apply full-image header fit across all L&J pages'
          git push origin HEAD:master
