name: Parlee Linemate Bridge QA
on:
  pull_request:
    paths:
      - 'Demon_Lord.html'
      - 'demon_lord.js'
      - 'demon_lord_badges.js'
      - 'data/demon_lord_intel.json'
      - 'scripts/linemate_parlee_bridge.js'
      - 'scripts/linemate_parlee_bridge.test.js'
      - 'scripts/parlee_ljpc_handoff.js'
      - 'scripts/parlee_ljpc_handoff.test.js'
      - 'scripts/parlee_research_ttl.js'
      - 'scripts/parlee_research_ttl.test.js'
      - '.github/workflows/lj-parlee-bridge-ci.yml'
  push:
    branches: [master]
    paths:
      - 'scripts/linemate_parlee_bridge.js'
      - 'scripts/linemate_parlee_bridge.test.js'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check demon_lord.js
          node --check demon_lord_badges.js
          node --check scripts/linemate_parlee_bridge.js
          node --check scripts/parlee_ljpc_handoff.js
          node --check scripts/parlee_research_ttl.js
      - name: Validate source research feed
        run: |
          node -e "const d=require('./data/demon_lord_intel.json');if(d.schema_version!=='LJ-DEMON-LORD-1'||!Array.isArray(d.trends)||!Array.isArray(d.parlays)||!Array.isArray(d.conflicts))process.exit(1);console.log('Source intelligence schema passes')"
      - name: Run synthetic matching tests
        run: node --test scripts/linemate_parlee_bridge.test.js scripts/parlee_ljpc_handoff.test.js scripts/parlee_research_ttl.test.js
      - name: Real snapshot LSI handoff smoke test
        run: |
          node scripts/parlee_ljpc_handoff.js data/demon_lord_intel.json data/future_market_board.json /tmp/parlee-ljpc-review-ci.json
          node -e "const x=require('/tmp/parlee-ljpc-review-ci.json');if(x.counts.exact_ljpc_matches!==0||x.entries.some(r=>r.ljpc!==null))process.exit(1);console.log('Empty Linemate feed causes no fabricated LJPC')"

