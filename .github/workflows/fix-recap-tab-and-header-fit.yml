name: Fix recap tab and header fit

on:
  push:
    paths:
      - '.github/workflows/fix-recap-tab-and-header-fit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply recap-tab removal and full-image header fit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def append_once(path, marker, block):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if marker not in text:
                  p.write_text(text.rstrip() + '\n\n' + block.strip() + '\n', encoding='utf-8')

          append_once(
              'ljstyle.css',
              'LJ REMOVE RECAP SPORTS-NAV TILE',
              r'''
/* LJ REMOVE RECAP SPORTS-NAV TILE — keep recap action buttons, remove only the large grid tab */
.sports-nav .sport-link[href*="Recap"],
.sports-nav .sport-link[href*="recap"]{display:none!important}
'''
          )

          append_once(
              'recaplink.js',
              'LJDP FULL-IMAGE HERO FIT',
              r'''
/* LJDP FULL-IMAGE HERO FIT */
(() => {
  if (document.getElementById('ljdp-full-image-hero-fit')) return;
  const style = document.createElement('style');
  style.id = 'ljdp-full-image-hero-fit';
  style.textContent = `
    .hero.ljdp-sport-hero{
      min-height:clamp(420px,42.86vw,590px)!important;
    }
    .hero.ljdp-sport-hero:after{
      background-size:100% 100%,contain!important;
      background-position:center,center!important;
      background-color:#0c0d11!important;
    }
    @media(max-width:620px){
      .hero.ljdp-sport-hero{min-height:420px!important}
    }
  `;
  document.head.appendChild(style);
})();
'''
          )

          append_once(
              'ljlivepred_app.js',
              'LJ LIVE FULL-IMAGE HERO FIT',
              r'''
/* LJ LIVE FULL-IMAGE HERO FIT */
(() => {
  if (document.getElementById('lj-live-full-image-hero-fit')) return;
  const style = document.createElement('style');
  style.id = 'lj-live-full-image-hero-fit';
  style.textContent = `
    .hero.lj-live-hero{
      min-height:clamp(420px,42.86vw,590px)!important;
    }
    .hero.lj-live-hero:after{
      background-size:100% 100%,contain!important;
      background-position:center,center!important;
      background-color:#0c0d11!important;
    }
    @media(max-width:620px){
      .hero.lj-live-hero{min-height:420px!important}
    }
  `;
  document.head.appendChild(style);
})();
'''
          )

          append_once(
              'live/live.css',
              'LJ LIVE SHARED HIGH-RES HEADER FULL FIT',
              r'''
/* LJ LIVE SHARED HIGH-RES HEADER FULL FIT */
.live-hero{min-height:clamp(420px,42.86vw,590px)!important}
.live-hero:after{
  content:""!important;
  position:absolute!important;
  inset:0!important;
  width:100%!important;
  height:100%!important;
  z-index:1!important;
  pointer-events:none!important;
  opacity:1!important;
  filter:none!important;
  background-color:#0c0d11!important;
  background-image:linear-gradient(90deg,#0c0d11 0%,rgba(12,13,17,.96) 20%,rgba(12,13,17,.78) 42%,rgba(12,13,17,.28) 64%,rgba(12,13,17,.05) 100%),url('../assets/headers/lj-live-shared.png')!important;
  background-size:100% 100%,contain!important;
  background-position:center,center!important;
  background-repeat:no-repeat!important;
  image-rendering:auto!important;
  transform:translateZ(0)
}
.live-hero>*{position:relative;z-index:2}
@media(max-width:620px){.live-hero{min-height:420px!important}}
'''
          )

          append_once(
              'assets/ljpd-recap-loader.js',
              'LJ RECAP FULL-IMAGE HERO FIT',
              r'''
/* LJ RECAP FULL-IMAGE HERO FIT */
(() => {
  if (document.getElementById('lj-recap-full-image-hero-fit')) return;
  const style = document.createElement('style');
  style.id = 'lj-recap-full-image-hero-fit';
  style.textContent = `
    body.recap-page .hero.recap-hero{
      min-height:clamp(420px,42.86vw,590px)!important;
      aspect-ratio:21/9!important;
      background-size:contain!important;
      background-position:center!important;
      background-color:#090713!important;
    }
    @media(max-width:620px){
      body.recap-page .hero.recap-hero{min-height:420px!important}
    }
  `;
  document.head.appendChild(style);
})();
'''
          )
          PY

      - name: Commit site fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'L&J Site Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add ljstyle.css recaplink.js ljlivepred_app.js live/live.css assets/ljpd-recap-loader.js
          if git diff --cached --quiet; then
            echo 'Site fixes already applied.'
            exit 0
          fi
          git commit -m 'Remove recap nav tab and fit full header artwork'
          git push origin HEAD:master
