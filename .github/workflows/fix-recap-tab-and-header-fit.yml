name: Fix recap tab and header fit

on:
  push:
    paths:
      - '.github/workflows/fix-recap-tab-and-header-fit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply site patch
        run: python .github/scripts/fix_headers.py
      - name: Commit site fixes
        run: |
          git config user.name 'L&J Site Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add ljstyle.css recaplink.js ljlivepred_app.js live/live.css assets/ljpd-recap-loader.js
          if git diff --cached --quiet; then
            echo 'Site fixes already applied.'
            exit 0
          fi
          git commit -m 'Remove recap nav tab and fit full header artwork'
          git push origin HEAD:master
