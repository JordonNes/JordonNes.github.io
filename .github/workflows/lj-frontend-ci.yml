name: L&J Frontend QA

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'LJ_index.html'
      - 'Quickie_Generator.html'
      - 'Treasure_Troll.html'
      - 'I_Spy.html'
      - 'lj_special_pages.js'
      - 'data/lsi_ispy_signals.js'
      - 'scripts/test_lj_special_pages.js'
      - 'LSI_Status.html'
      - 'lsi_status.js'
      - 'NFL.html'
      - 'MLB.html'
      - 'NBA.html'
      - 'WNBA.html'
      - 'NHL.html'
      - 'NCAA_Football.html'
      - 'NCAA_Basketball.html'
      - 'FIBA.html'
      - 'FIBA_Men.html'
      - 'FIBA_Women.html'
      - 'fiba_hub.js'
      - 'fiba_scenario_engine.js'
      - 'data/fiba_competitions.js'
      - 'scripts/fiba_hub_audit.js'
      - 'scripts/fiba_scenario_test.js'
      - 'MMA.html'
      - 'Boxing.html'
      - 'Tennis.html'
      - 'data/future_market_board.js'
      - 'scripts/qc_publication_audit.js'
      - 'ljapp.js'
      - 'ljqc.css'
      - 'lsi_registry_bridge.js'
      - 'data/prediction_registry.js'
      - 'scripts/frontend_home_audit.js'
      - '.github/workflows/lj-frontend-ci.yml'

permissions:
  contents: read

concurrency:
  group: lj-frontend-qa
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: JavaScript syntax
        run: |
          node --check ljapp.js
          node --check lj_special_pages.js
          node --check lsi_registry_bridge.js
          node --check scripts/frontend_home_audit.js
          node --check scripts/qc_publication_audit.js
          node --check fiba_hub.js
          node --check fiba_scenario_engine.js
          node --check data/fiba_competitions.js
          node --check scripts/fiba_hub_audit.js
          node --check scripts/fiba_scenario_test.js
          node --check scripts/test_lj_special_pages.js
      - name: Specialty intelligence regression tests
        run: node scripts/test_lj_special_pages.js
      - name: LJ_index + QC presentation audit
        run: |
          node scripts/frontend_home_audit.js
          node scripts/qc_publication_audit.js
          node scripts/fiba_hub_audit.js
          node scripts/fiba_scenario_test.js
