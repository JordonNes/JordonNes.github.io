name: LJ Live Header Patch

on:
  push:
    paths:
      - '.github/workflows/live-header-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch live renderer
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'L&J LIVE HIGH-RES HEADER PATCH' ljlivepred_app.js; then
            printf '%s' '' | base64 -d >> ljlivepred_app.js
          fi
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'L&J Site Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add ljlivepred_app.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Apply shared high-resolution L&J Live header'
          git push origin HEAD:master
