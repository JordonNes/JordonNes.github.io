name: I Spy Branch Refresh

on:
  push:
    branches: [fix-ispy-reporting-v2-20260928]
    paths:
      - 'scripts/lsi_ispy_discovery.py'
      - 'scripts/test_lsi_ispy_discovery.py'
      - 'ljapp.js'
      - 'lj_special_pages.js'
      - 'ljstyle.css'
      - '.github/workflows/ispy-branch-refresh.yml'

permissions:
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix-ispy-reporting-v2-20260928
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate code and discovery
        run: |
          bash -n scripts/publish_ispy_artifacts.sh
          python -m py_compile scripts/lsi_ispy_discovery.py scripts/lsi_publish_ispy.py
          python scripts/test_lsi_ispy_discovery.py
          node --check ljapp.js
          node --check lj_special_pages.js
          node scripts/frontend_home_audit.js
          python scripts/lsi_ispy_discovery.py
          python scripts/lsi_publish_ispy.py
      - name: Publish branch-only I Spy evidence for review
        run: |
          git config user.name 'LEGZ-JINX I Spy Test'
          git config user.email 'actions@users.noreply.github.com'
          git add data/lsi_ispy_candidates.json data/lsi_ispy_signals.json data/lsi_ispy_signals.js data/lsi_ispy_pattern_library.json data/ispy_nfl_context.json
          if git diff --cached --quiet; then
            echo 'No branch evidence changes.'
            exit 0
          fi
          git commit -m 'Refresh I Spy branch evidence'
          git push origin HEAD:fix-ispy-reporting-v2-20260928
