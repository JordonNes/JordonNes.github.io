name: LJDP Fast Moneylines

on:
  workflow_dispatch:
  schedule:
    - cron: '12 * * * *'
  push:
    branches: [master]
    paths:
      - 'scripts/propline_adapter.py'
      - 'scripts/lsi_publish_future_board.py'
      - '.github/workflows/ljdp-moneylines.yml'

permissions:
  contents: write

concurrency:
  group: ljdp-fast-moneylines
  cancel-in-progress: true

jobs:
  moneylines:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: {ref: master, fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}

      - name: Acquire and publish GAME_ML
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY || vars.PROPLINE_API_KEY }}
          PROP_LINE_API_KEY: ${{ secrets.PROP_LINE_API_KEY || vars.PROP_LINE_API_KEY }}
          PROPLINE_HTTP_TIMEOUT_SEC: '8'
          PROPLINE_HTTP_ATTEMPTS: '1'
        run: |
          python - <<'PY'
          import os
          present=bool((os.getenv('PROPLINE_API_KEY') or os.getenv('PROP_LINE_API_KEY') or '').strip())
          print(f'PropLine credential available: {present}')
          if not present:
              raise SystemExit('No PROPLINE_API_KEY / PROP_LINE_API_KEY is available to this workflow')
          PY
          python scripts/propline_adapter.py --game-odds-only
          python scripts/lsi_publish_future_board.py

      - name: Validate moneyline publication
        run: |
          python - <<'PY'
          import json, pathlib
          from datetime import datetime, timezone
          ml=pathlib.Path('data/current_game_moneylines.json')
          future=pathlib.Path('data/future_market_board.json')
          futurejs=pathlib.Path('data/future_market_board.js')
          assert ml.exists() and ml.stat().st_size>100, 'current_game_moneylines.json missing/empty'
          assert future.exists() and future.stat().st_size>100, 'future_market_board.json missing/empty'
          assert futurejs.exists() and futurejs.stat().st_size>100, 'future_market_board.js missing/empty'
          m=json.load(ml.open(encoding='utf-8'))
          f=json.load(future.open(encoding='utf-8'))
          assert m.get('schema_version')=='LJ-CURRENT-GAME-ML-1'
          assert f.get('schema_version')=='LJ-FUTURE-MARKET-1'
          rows=[r for r in m.get('rows',[]) if r.get('market_class')=='GAME_ML' and r.get('event_id') and r.get('participant') and r.get('price') not in (None,'')]
          assert rows, 'No usable GAME_ML rows'
          stamp=datetime.fromisoformat(m['generated_at_utc'].replace('Z','+00:00'))
          age=(datetime.now(timezone.utc)-stamp).total_seconds()/3600
          assert age<=2, f'GAME_ML candidate stale at publication: {age:.2f}h'
          source_ids={str(e.get('source_event_id')) for e in m.get('events',[]) if e.get('source_event_id')}
          future_ids={str(e.get('source_event_id')) for e in f.get('events',[]) if e.get('game_markets')}
          missing=sorted(source_ids-future_ids)
          assert not missing, f'Future board lost GAME_ML event(s): {missing[:12]}'
          print(f'GAME_ML healthy: {len(rows)} quotes; {len(source_ids)} events; future coverage complete; age={age:.2f}h')
          PY

      - name: Publish artifacts to master
        shell: bash
        run: |
          git config user.name 'LEGZ-JINX LSI'
          git config user.email 'actions@users.noreply.github.com'
          git add data/current_game_moneylines.json data/future_market_board.json data/future_market_board.js
          if git diff --cached --quiet; then
            echo 'GAME_ML artifacts already current.'
            exit 0
          fi
          git commit -m "LJDP fast GAME_ML $(TZ=America/Los_Angeles date +%F-%H%M) PT"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin master
            if git push origin master; then exit 0; fi
            echo "GAME_ML push race; retrying ${attempt}/5"
            sleep 3
          done
          exit 1
