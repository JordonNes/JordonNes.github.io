name: LJDP Fast Markets

on:
  workflow_dispatch:
  schedule:
    - cron: '12 * * * *'
  push:
    branches: [master]
    paths:
      - 'scripts/propline_adapter.py'
      - 'scripts/odds_adapter.py'
      - 'scripts/lsi_pipeline.py'
      - 'scripts/lsi_publish_future_board.py'
      - 'data/verified_market_overrides.json'
      - '.github/workflows/ljdp-moneylines.yml'


permissions:
  contents: write

concurrency:
  group: lsi-market-writer
  cancel-in-progress: false

jobs:
  moneylines:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: {ref: master, fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}

      - name: Acquire current NFL markets
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY || vars.PROPLINE_API_KEY }}
          PROP_LINE_API_KEY: ${{ secrets.PROP_LINE_API_KEY || vars.PROP_LINE_API_KEY }}
          PROPLINE_HTTP_TIMEOUT_SEC: '8'
          PROPLINE_HTTP_ATTEMPTS: '1'
          PROPLINE_LEAGUES: 'NFL'
          PROPLINE_RATE_LIMIT_COOLDOWN_MIN: '90'
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY || vars.ODDS_API_KEY || secrets.THE_ODDS_API_KEY || vars.THE_ODDS_API_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY || vars.THE_ODDS_API_KEY || secrets.ODDS_API_KEY || vars.ODDS_API_KEY }}
          ENABLE_THE_ODDS_API: 'true'
          ODDS_API_LEAGUES: 'NFL'
          ODDS_API_LOOKAHEAD_HOURS: '96'
          ODDS_API_MAX_EVENTS_PER_RUN: '16'
          ODDS_API_PROP_TTL_MIN: '120'
        run: |
          set +e
          python scripts/propline_adapter.py --game-odds-only
          echo "PropLine fast pass exit=$?; continuing to NFL prop fallback."
          set -e
          python scripts/odds_adapter.py
          python scripts/lsi_pipeline.py
          python -m py_compile scripts/lsi_publish_future_board.py
          python scripts/lsi_publish_future_board.py

      - name: Validate NFL QC market publication
        run: |
          python - <<'PY'
          import json, pathlib
          qc=pathlib.Path('data/qc_prop_board.json')
          future=pathlib.Path('data/future_market_board.json')
          futurejs=pathlib.Path('data/future_market_board.js')
          registry=pathlib.Path('data/prediction_registry.json')
          assert qc.exists() and qc.stat().st_size>100, 'qc_prop_board.json missing/empty'
          assert future.exists() and future.stat().st_size>100, 'future_market_board.json missing/empty'
          assert futurejs.exists() and futurejs.stat().st_size>100, 'future_market_board.js missing/empty'
          assert registry.exists() and registry.stat().st_size>100, 'prediction_registry.json missing/empty'
          from datetime import datetime, timezone
          ml=pathlib.Path('data/current_game_moneylines.json')
          assert ml.exists() and ml.stat().st_size>100, 'current_game_moneylines.json missing/empty'
          m=json.load(ml.open(encoding='utf-8'))
          assert m.get('schema_version')=='LJ-CURRENT-GAME-ML-1'
          stamp=datetime.fromisoformat(m['generated_at_utc'].replace('Z','+00:00'))
          age=(datetime.now(timezone.utc)-stamp).total_seconds()/3600
          assert age<=2, f'GAME_ML canonical artifact stale before future-board publication: {age:.2f}h'
          usable=[x for x in m.get('rows',[]) if x.get('market_class')=='GAME_ML' and x.get('event_id') and x.get('participant') and x.get('price') not in (None,'')]
          assert usable, 'No usable GAME_ML rows in canonical artifact'
          q=json.load(qc.open(encoding='utf-8'))
          f=json.load(future.open(encoding='utf-8'))
          nfl_q=[e for e in q.get('events',[]) if e.get('league')=='NFL']
          nfl_f=[e for e in f.get('events',[]) if e.get('league')=='NFL']
          prop_events=[e for e in nfl_q if e.get('props')]
          prop_count=sum(len(e.get('props') or []) for e in nfl_q)
          future_prop_count=sum(len(e.get('props') or []) for e in nfl_f)
          assert len(nfl_q)>=14, f'NFL event catalog too incomplete to publish: {len(nfl_q)}/15'
          if len(prop_events)<10:
              print(f"::warning::NFL player-prop acquisition shortfall: {len(prop_events)} event(s) currently carry props. Preserve the durable slate and let the T-48 coverage monitor expose the deficit instead of blocking publication.")
          assert prop_count>0 and future_prop_count>0, 'NFL props did not reach future market board'
          pairs=sorted(f"{e.get('away')} @ {e.get('home')}" for e in nfl_q)
          print("NFL board events:", " | ".join(pairs))
          print(f'NFL QC markets publishable: events={len(nfl_q)}/15 prop_events={len(prop_events)} props={prop_count} future_props={future_prop_count}. Missing event remains on the durable DP shell rather than blocking the week.')
          PY

      - name: Verify rendered NFL QC population
        run: node scripts/qc_publication_audit.js

      - name: Publish artifacts to master
        shell: bash
        run: |
          git config user.name 'LEGZ-JINX LSI'
          git config user.email 'actions@users.noreply.github.com'
          files=()
          for f in data/current_game_moneylines.json data/qc_prop_board.json data/the_odds_api_state.json data/market_history.csv data/prediction_registry.json data/prediction_registry.js data/future_market_board.json data/future_market_board.js; do
            [ -s "$f" ] && files+=("$f")
          done
          git add "${files[@]}"
          if git diff --cached --quiet; then
            echo 'NFL market artifacts already current.'
            exit 0
          fi
          git commit -m "LJDP fast NFL markets $(TZ=America/Los_Angeles date +%F-%H%M) PT"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin master
            if git push origin master; then exit 0; fi
            echo "NFL market push race; retrying ${attempt}/5"
            sleep 3
          done
          exit 1
