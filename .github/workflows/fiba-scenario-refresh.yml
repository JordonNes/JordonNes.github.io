name: FIBA Scenario State Refresh

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'data/fiba_competitions.js'
      - 'fiba_scenario_engine.js'
      - 'scripts/fiba_scenario_export.js'
      - '.github/workflows/fiba-scenario-refresh.yml'

permissions:
  contents: write

concurrency:
  group: fiba-scenario-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Export current scenario state
        run: node scripts/fiba_scenario_export.js
      - name: Validate scenario state
        run: node scripts/fiba_scenario_test.js
      - name: Commit changed state
        run: |
          if git diff --quiet -- data/fiba_scenario_state.json; then
            echo "FIBA scenario state already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fiba_scenario_state.json
          git commit -m "Refresh FIBA scenario state"
          git push
