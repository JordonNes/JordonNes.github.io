name: D&G 15-Minute Historical Research Backfill
on:
  workflow_dispatch:
    inputs:
      series:
        description: 'One allowed 15-minute Kalshi series, e.g. KXGOLD15M'
        required: false
        default: 'KXGOLD15M'
      max_markets:
        description: 'Maximum settled-market candle requests this run (1-150)'
        required: false
        default: '80'
  push:
    branches: [master]
    paths:
      - 'scripts/collect-dg-15m-history.mjs'
      - 'damilola-gavavi/dg-15m-calibration.js'
      - '.github/workflows/dg-15m-research-backfill.yml'
  schedule:
    - cron: '21 * * * *'
permissions:
  contents: write
concurrency:
  group: dg-15m-history
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify risk and historical calibration checks
        run: node --test damilola-gavavi/dg-15m-fee-metadata.test.cjs damilola-gavavi/dg-15m-calibration.test.cjs damilola-gavavi/dg-15m-economics.test.cjs damilola-gavavi/dg-15m-kalshi-schema.test.cjs
      - name: Choose supported 15-minute series (rotate on hourly schedule)
        id: choice
        env:
          SPECIFIED: ${{ github.event.inputs.series }}
          LIMIT: ${{ github.event.inputs.max_markets }}
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          ALL=(KXGOLD15M KXSILVER15M KXWTI15M KXCOPPER15M KXNATGAS15M KXPALLADIUM15M KXPLATINUM15M KXBTC15M KXETH15M KXSOL15M KXXRP15M KXHYPE15M KXEURUSD15M)
          if [[ "$EVENT" == "schedule" ]]; then
            IDX=$(( $(date +%s)/3600 % ${#ALL[@]} ))
            PICK="${ALL[$IDX]}"
            COUNT=40
          elif [[ "$EVENT" == "push" ]]; then
            PICK="KXGOLD15M,KXSILVER15M,KXBTC15M"
            COUNT=35
          else
            PICK="${SPECIFIED:-KXGOLD15M}"
            COUNT="${LIMIT:-80}"
          fi
          echo "series=$PICK" >> "$GITHUB_OUTPUT"
          echo "limit=$COUNT" >> "$GITHUB_OUTPUT"
      - name: Collect sourced settled outcomes and pre-resolution prices
        id: collection
        shell: bash
        env:
          DG_SERIES_SET: ${{ steps.choice.outputs.series }}
          LIMIT: ${{ steps.choice.outputs.limit }}
        run: |
          IFS=',' read -ra TARGETS <<< "$DG_SERIES_SET"
          SUCCESS=0
          RESULTS=""
          for TARGET in "${TARGETS[@]}"; do
            echo "::group::Collect $TARGET"
            OUTCOME="failed"
            if DG_SERIES="$TARGET" DG_MAX_MARKETS="$LIMIT" node scripts/collect-dg-15m-history.mjs; then
              SUCCESS=$((SUCCESS+1))
              OUTCOME="dataset_written"
            else
              echo "::warning title=Historical data collection failed::Series $TARGET did not yield a validated dataset; inspect preceding Kalshi API diagnostics"
            fi
            RESULTS="${RESULTS}${RESULTS:+,}{\"series\":\"$TARGET\",\"status\":\"$OUTCOME\"}"
            echo "::endgroup::"
          done
          mkdir -p damilola-gavavi/data
          printf '{"checked_at_utc":"%s","source":"GitHub Actions public Kalshi historical collection","successful_series":%s,"series_results":[%s],"data_confirmed_only_by_dataset_files":true}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$SUCCESS" "$RESULTS" > damilola-gavavi/data/collection-status.json
          echo "success_count=$SUCCESS" >> "$GITHUB_OUTPUT"
      - name: Commit actual observations and validation metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add damilola-gavavi/data/*.json
          if git diff --cached --quiet; then
            echo "No new validated samples."
            exit 0
          fi
          git commit -m "Research: refresh verified Kalshi 15m quote/outcome evidence"
          git pull --rebase origin master
          git push origin HEAD:master

      - name: Surface source failure after persisting diagnostics
        if: ${{ steps.collection.outputs.success_count == '0' }}
        run: |
          echo "::error::No Kalshi 15-minute datasets passed the source validity checks. Review data/collection-status.json and preceding API errors."
          exit 1
