name: D&G 15-Minute Historical Research Backfill
on:
  workflow_dispatch:
    inputs:
      series:
        description: 'One allowed 15-minute Kalshi series, e.g. KXGOLD15M'
        required: false
        default: 'KXGOLD15M'
      max_markets:
        description: 'Maximum settled-market candle requests this run (1-150)'
        required: false
        default: '80'
  push:
    branches: [master]
    paths:
      - 'scripts/collect-dg-15m-history.mjs'
      - 'damilola-gavavi/dg-15m-calibration.js'
      - '.github/workflows/dg-15m-research-backfill.yml'
  schedule:
    - cron: '21 * * * *'
permissions:
  contents: write
concurrency:
  group: dg-15m-history
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify risk and historical calibration checks
        run: node --test damilola-gavavi/dg-15m-calibration.test.cjs damilola-gavavi/dg-15m-economics.test.cjs
      - name: Choose supported 15-minute series (rotate on hourly schedule)
        id: choice
        env:
          SPECIFIED: ${{ github.event.inputs.series }}
          LIMIT: ${{ github.event.inputs.max_markets }}
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          ALL=(KXGOLD15M KXSILVER15M KXWTI15M KXCOPPER15M KXNATGAS15M KXPALLADIUM15M KXPLATINUM15M KXBTC15M KXETH15M KXSOL15M KXXRP15M KXHYPE15M KXEURUSD15M)
          if [[ "$EVENT" == "schedule" ]]; then
            IDX=$(( $(date +%s)/3600 % ${#ALL[@]} ))
            PICK="${ALL[$IDX]}"
            COUNT=30
          else
            PICK="${SPECIFIED:-KXGOLD15M}"
            COUNT="${LIMIT:-80}"
          fi
          echo "series=$PICK" >> "$GITHUB_OUTPUT"
          echo "limit=$COUNT" >> "$GITHUB_OUTPUT"
      - name: Collect sourced settled outcomes and pre-resolution quotes
        env:
          DG_SERIES: ${{ steps.choice.outputs.series }}
          DG_MAX_MARKETS: ${{ steps.choice.outputs.limit }}
        run: node scripts/collect-dg-15m-history.mjs
      - name: Commit actual observations and validation metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add damilola-gavavi/data/15m-*.json
          if git diff --cached --quiet; then
            echo "No new validated samples."
            exit 0
          fi
          git commit -m "Research: refresh verified Kalshi 15m quote/outcome evidence"
          git pull --rebase origin master
          git push origin HEAD:master
