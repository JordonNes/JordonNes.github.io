name: LSI Daily Predictions Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13,16,19,22 * * *'
    - cron: '0 1,4 * * *'

permissions:
  contents: write

concurrency:
  group: lsi-dp-pipeline
  cancel-in-progress: false

jobs:
  lsi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {ref: master, fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Resolve Pacific run stage
        id: clock
        shell: bash
        run: |
          PT_HOUR=$(TZ=America/Los_Angeles date +%H); PT_DATE=$(TZ=America/Los_Angeles date +%F)
          case "$PT_HOUR" in 06) STAGE=DISCOVERY;;09) STAGE=MORNING_PUBLICATION;;12) STAGE=MIDDAY_PUBLICATION;;15) STAGE=MARKET_HISTORY;;18) STAGE=CONTEXT_MARKETS;;21) STAGE=MASTER_PUBLICATION;;*) STAGE=MANUAL_OR_DST_GUARD;;esac
          echo "hour=$PT_HOUR" >> "$GITHUB_OUTPUT"; echo "date=$PT_DATE" >> "$GITHUB_OUTPUT"; echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
      - name: LSI free-first source acquisition
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python scripts/lsi_ingest.py
      - name: RotoWire context acquisition — public RSS first
        env:
          ROTOWIRE_API_KEY: ${{ secrets.ROTOWIRE_API_KEY }}
        run: python scripts/rotowire_adapter.py
      - name: PropLine Level-B prop acquisition — market discovery first
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
          PROP_LINE_API_KEY: ${{ secrets.PROP_LINE_API_KEY }}
          PROPLINE_ANALYTICS_ENABLED: ${{ vars.PROPLINE_ANALYTICS_ENABLED }}
        run: python scripts/propline_adapter.py
      - name: NHL authoritative enrichment
        run: python scripts/nhl_adapter.py
      - name: Three-level prop acquisition — Level B
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/odds_adapter.py
      - name: Build and validate Prediction Registry
        run: python scripts/lsi_pipeline.py
      - name: OpenAI LSI router — dry run and usage estimate
        run: python scripts/lsi_openai_router.py --dry-run
      - name: Market Availability Monitor
        shell: bash
        run: |
          python - <<'PY'
          import csv, pathlib
          p=pathlib.Path('data/market_history.csv'); counts={}
          if p.exists():
            for r in csv.DictReader(p.open()):
              if r.get('market_class')=='PLAYER_PROP': counts[r.get('league')]=counts.get(r.get('league'),0)+1
          print('MAM PLAYER_PROP inventory:',counts)
          for league in ('NFL','NCAA_Football'):
            if counts.get(league,0)==0: print(f'::warning::MAM: zero {league} PLAYER_PROP observations; DP WATCH must not be treated as proof markets are unavailable.')
          PY
      - name: Validate publication invariants
        run: |
          test -f LJ_index.html && test -f Quickie_Generator.html && test -f data/prediction_registry.json
          test -f data/openai_dry_run_router.json && test -f data/openai_usage_estimates.csv && test -f data/openai_usage_summary.json
          grep -q 'PLAYER_PROP' data/prediction_registry.json && grep -q 'GAME_ML' data/prediction_registry.json
          grep -q 'DRY_RUN_NO_NETWORK' data/openai_dry_run_router.json
          python - <<'PY'
          import json
          payload=json.load(open('data/prediction_registry.json',encoding='utf-8'))
          assert payload.get('schema_version')=='LSI-PR-2', payload.get('schema_version')
          required=set(payload.get('player_prop_fields') or [])
          assert required, 'PLAYER_PROP field contract missing'
          props=[p for p in payload.get('predictions',[]) if p.get('market_class')=='PLAYER_PROP']
          missing={p.get('prediction_id'):sorted(required-set(p)) for p in props if required-set(p)}
          assert not missing, missing
          print(f'LSI-PR-2 invariant: {len(props)} PLAYER_PROP records contain all {len(required)} intelligence fields')
          PY
      - name: Commit durable LSI outputs
        shell: bash
        run: |
          git config user.name 'LEGZ-JINX LSI'; git config user.email 'actions@users.noreply.github.com'
          git add data/prediction_registry.json data/market_history.csv data/event_inventory.csv data/weather_history.csv data/venue_coordinates.json data/cfbd data/cfbd_state.json data/rotowire_context.csv data/context_registry.json data/propline_intelligence.json data/propline_state.json data/openai_dry_run_router.json data/openai_usage_estimates.csv data/openai_usage_summary.json 2>/dev/null || true
          if git diff --cached --quiet; then echo 'No LSI changes to publish.'; else git commit -m "LSI ${{ steps.clock.outputs.stage }} ${{ steps.clock.outputs.date }} PT" && git push origin master; fi
