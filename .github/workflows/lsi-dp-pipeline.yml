name: LSI Daily Predictions Pipeline

# FINAL WEBSITE RELEASE TRIGGER — evaluated POMs + Game Winner Spectrum
# Spectrum v3 runtime validation trigger
# LEGZ SYNTHETIC BOOK RELEASE TRIGGER

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Publication stage for a manual run
        required: true
        default: DISCOVERY
        type: choice
        options: [DISCOVERY, MORNING_PUBLICATION, MIDDAY_PUBLICATION, MARKET_HISTORY, CONTEXT_MARKETS, MASTER_PUBLICATION]
  push:
    branches: [master]
    paths:
      - 'scripts/lsi_ingest.py'
      - 'scripts/lsi_checkpoint_clock.py'
      - 'scripts/test_lsi_checkpoint_clock.py'
      - 'scripts/espn_intelligence_adapter.py'
      - 'scripts/test_espn_intelligence_adapter.py'
      - 'scripts/espn_player_enrichment.py'
      - 'scripts/test_espn_player_enrichment.py'
      - 'config/lsi_sources.json'
      - 'scripts/odds_adapter.py'
      - 'scripts/kalshi_public_adapter.py'
      - 'scripts/propline_adapter.py'
      - 'scripts/parlayapi_retail_props.py'
      - 'scripts/test_parlayapi_retail_props.py'
      - 'scripts/test_propline_bulk_catalog.py'
      - 'scripts/oddspapi_history_adapter.py'
      - 'scripts/lsi_pipeline.py'
      - 'scripts/lsi_league_scheduler.py'
      - 'scripts/test_lsi_league_scheduler.py'
      - 'scripts/test_legz_material_hash.py'
      - 'scripts/legz_statistical_spectrum.py'
      - 'scripts/test_ncaa_history_continuity.py'
      - 'scripts/legz_prop_ladder_test.py'
      - 'scripts/legz_synthetic_book.py'
      - 'scripts/lsi_history_warehouse.py'
      - 'scripts/lsi_performance_ingest.py'
      - 'scripts/lsi_market_history_delta.py'
      - 'scripts/lsi_t48_coverage.py'
      - 'scripts/lsi_projection_gap_report.py'
      - 'scripts/lsi_readiness_report.py'
      - 'scripts/lsi_visual_registry.py'
      - 'scripts/lsi_publish_future_board.py'
      - 'scripts/test_lsi_future_board_guard.py'
      - 'scripts/lsi_game_winner_spectrum.py'
      - 'scripts/lsi_promote_learning.py'
      - 'data/learning_overlay.json'
      - 'data/fiba_scenario_state.json'
      - 'data/lsi_spectrum_cache.json'
      - 'data/performance_history.csv'
      - 'data/history/**'
      - 'data/history_coverage.json'
      - 'scripts/qc_publication_audit.js'
      - 'scripts/lsi_snapshot_tickets.js'
      - 'lsi_registry_bridge.js'
      - '.github/workflows/lsi-dp-pipeline.yml'
  schedule:
    # Separate cron identities are intentional. The checkpoint resolver uses the
    # exact triggering cron, so GitHub runner delays cannot change the PT stage.
    - cron: '0 1 * * *'
    - cron: '0 2 * * *'
    - cron: '0 4 * * *'
    - cron: '0 5 * * *'
    - cron: '0 13 * * *'
    - cron: '0 14 * * *'
    - cron: '0 16 * * *'
    - cron: '0 17 * * *'
    - cron: '0 19 * * *'
    - cron: '0 20 * * *'
    - cron: '0 22 * * *'
    - cron: '0 23 * * *'

permissions:
  contents: write

concurrency:
  group: lsi-market-writer
  cancel-in-progress: false

jobs:
  clock:
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.resolve.outputs.stage }}
      date: ${{ steps.resolve.outputs.date }}
      run_allowed: ${{ steps.resolve.outputs.run_allowed }}
      canonical_checkpoint: ${{ steps.resolve.outputs.canonical_checkpoint }}
      scheduled_for_pt: ${{ steps.resolve.outputs.scheduled_for_pt }}
    steps:
      - uses: actions/checkout@v7
        with: {ref: master}
      - name: Resolve delay-safe Pacific checkpoint
        id: resolve
        shell: bash
        env:
          MANUAL_STAGE: ${{ inputs.stage }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
          # Ordinary pushes are DISCOVERY; canonical publication identity comes
          # only from the six scheduled PT checkpoints or an explicit manual stage.
          PUSH_STAGE: DISCOVERY
        run: |
          python scripts/lsi_checkpoint_clock.py \
            --event-name "${{ github.event_name }}" \
            --schedule "$SCHEDULE_EXPR" \
            --manual-stage "$MANUAL_STAGE" \
            --push-stage "$PUSH_STAGE" \
            --github-output "$GITHUB_OUTPUT"

  lsi:
    needs: clock
    if: needs.clock.outputs.run_allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: {ref: master, fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Merge incremental market-history delta into runtime base
        run: python scripts/lsi_market_history_delta.py merge
      - name: Reuse durable game lines before detailed prop acquisition
        run: |
          # The hourly near-event gate owns high-frequency due checks. Before any
          # detailed prop sweep, reuse the durable last-known-good game-line artifact
          # rather than recollecting an unchanged market merely because the clock ran.
          python scripts/lsi_publish_future_board.py

      - name: LSI free-first source acquisition
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python scripts/lsi_ingest.py
      - name: Resolve league/event work due at this checkpoint
        id: league_schedule
        shell: bash
        env:
          CANONICAL_CHECKPOINT: ${{ needs.clock.outputs.canonical_checkpoint }}
        run: |
          python scripts/lsi_league_scheduler.py
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json,os
          d=json.load(open('data/lsi_league_schedule.json',encoding='utf-8'))
          market_work=bool(d.get('has_work'))
          checkpoint=os.environ.get('CANONICAL_CHECKPOINT','false').lower()=='true'
          print('has_work=' + ('true' if market_work else 'false'))
          print('cycle_required=' + ('true' if (market_work or checkpoint) else 'false'))
          print('due_leagues=' + ','.join(d.get('due_leagues') or []))
          print('propline_leagues=' + ','.join(d.get('propline_leagues') or []))
          print('odds_api_leagues=' + ','.join(d.get('odds_api_leagues') or []))
          PY
      - name: Verify event-aware scheduling rules
        run: |
          python scripts/test_lsi_checkpoint_clock.py
          python scripts/test_ncaa_history_continuity.py
          python scripts/test_lsi_future_board_guard.py
          python scripts/test_propline_bulk_catalog.py
          python scripts/test_parlayapi_retail_props.py
          python scripts/test_lsi_league_scheduler.py
          python scripts/test_legz_material_hash.py
      - name: Verify ESPN sports-truth adapter
        run: python scripts/test_espn_intelligence_adapter.py
      - name: Verify sportsbook player identity normalization
        run: |
          python - <<'PY'
          from scripts.legz_statistical_spectrum import player_norm, market_metric
          assert player_norm("CJ Abrams: 1+") == "cj abrams"
          assert player_norm("Dillon Dingler: 2+") == "dillon dingler"
          assert market_metric("Outs Recorded") == "pitching_outs"
          print("MLB player identity normalization and pitching-outs mapping passed.")
          PY
      - name: Preload persistent season schedules and roster identity
        continue-on-error: true
        run: python scripts/lsi_season_preload.py
      - name: Refresh ESPN persistent sports-truth intelligence
        if: steps.league_schedule.outputs.cycle_required == 'true'
        continue-on-error: true
        env:
          ESPN_INTELLIGENCE_LEAGUES: ${{ steps.league_schedule.outputs.due_leagues }}
          ESPN_INTELLIGENCE_LOOKAHEAD_HOURS: '96'
          ESPN_INTELLIGENCE_MAX_EVENTS_PER_LEAGUE: '24'
          ESPN_INTELLIGENCE_MAX_TEAMS: '48'
          ESPN_INTELLIGENCE_HTTP_TIMEOUT_SEC: '15'
          ESPN_INTELLIGENCE_HTTP_ATTEMPTS: '2'
        run: python scripts/espn_intelligence_adapter.py
      - name: Refresh ESPN visual asset reference registry
        continue-on-error: true
        run: python scripts/lsi_visual_registry.py
      - name: RotoWire context acquisition — public RSS first
        env:
          ROTOWIRE_API_KEY: ${{ secrets.ROTOWIRE_API_KEY }}
        run: python scripts/rotowire_adapter.py
      - name: Kalshi public offered-POM acquisition — primary free current market
        if: steps.league_schedule.outputs.cycle_required == 'true'
        continue-on-error: true
        env:
          KALSHI_MAX_PAGES: '4'
          KALSHI_PAGE_LIMIT: '1000'
          KALSHI_LOOKAHEAD_DAYS: '7'
          KALSHI_HTTP_TIMEOUT_SEC: '15'
        run: python scripts/kalshi_public_adapter.py
      - name: PropLine Level-B prop acquisition — optional overlay
        if: steps.league_schedule.outputs.propline_leagues != ''
        continue-on-error: true
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY || vars.PROPLINE_API_KEY }}
          PROP_LINE_API_KEY: ${{ secrets.PROP_LINE_API_KEY || vars.PROP_LINE_API_KEY }}
          PROPLINE_ANALYTICS_ENABLED: ${{ vars.PROPLINE_ANALYTICS_ENABLED }}
          PROPLINE_HTTP_TIMEOUT_SEC: '8'
          PROPLINE_HTTP_ATTEMPTS: '1'
          PROPLINE_LEAGUES: ${{ steps.league_schedule.outputs.propline_leagues }}
          PROPLINE_MAX_EVENT_REFRESHES_PER_RUN: '16'
          PROPLINE_MAX_REFRESH_PER_LEAGUE: '3'
          PROPLINE_RATE_LIMIT_COOLDOWN_MIN: '90'
          PROPLINE_MAX_PROP_MARKETS_PER_EVENT: '10'
          PROPLINE_INTELLIGENCE_RETENTION_DAYS: '2'
        run: python scripts/propline_adapter.py
      - name: Retail POM acquisition — PrizePicks + Underdog + DraftKings
        if: steps.league_schedule.outputs.cycle_required == 'true'
        continue-on-error: true
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY || vars.PARLAY_API_KEY }}
          PARLAYAPI_API_KEY: ${{ secrets.PARLAYAPI_API_KEY || vars.PARLAYAPI_API_KEY }}
          PARLAY_API_LEAGUES: ${{ steps.league_schedule.outputs.due_leagues }}
          PARLAY_API_MAX_SPORT_CALLS_PER_RUN: '3'
          PARLAY_API_MIN_REFRESH_MINUTES: '480'
          PARLAY_API_MONTHLY_CREDIT_CAP: '900'
          PARLAY_API_CREDIT_RESERVE: '100'
          PARLAY_API_MAX_AGE_SEC: '900'
        run: python scripts/parlayapi_retail_props.py
      - name: MLB forecast-first performance evidence warmup
        if: contains(steps.league_schedule.outputs.due_leagues, 'MLB')
        continue-on-error: true
        run: |
          # Current MLB POMs cannot receive LJPC until the exact player/metric has
          # enough completed-game evidence. MLB StatsAPI is free/public and avoids
          # the ESPN scoreboard 403 currently seen from Actions runners.
          python scripts/lsi_performance_ingest.py --days-back 28 --league MLB --max-events 450

      - name: OddsPapi historical calibration — free-first
        env:
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
          ODDS_PAPI_API_KEY: ${{ secrets.ODDS_PAPI_API_KEY }}
          LSI_STAGE: ${{ needs.clock.outputs.stage }}
          ODDSPAPI_MAX_DISCOVERY_CALLS: ${{ vars.ODDSPAPI_MAX_DISCOVERY_CALLS }}
          ODDSPAPI_MAX_HISTORY_FIXTURES: ${{ vars.ODDSPAPI_MAX_HISTORY_FIXTURES }}
          ODDSPAPI_MIN_QUOTA_REMAINING: ${{ vars.ODDSPAPI_MIN_QUOTA_REMAINING }}
          ODDSPAPI_BOOKMAKERS: ${{ vars.ODDSPAPI_BOOKMAKERS }}
        run: python scripts/oddspapi_history_adapter.py
      - name: NHL authoritative enrichment
        if: contains(steps.league_schedule.outputs.due_leagues, 'NHL')
        run: python scripts/nhl_adapter.py
      - name: Coverage-gap player-prop fallback — The Odds API
        if: steps.league_schedule.outputs.odds_api_leagues != ''
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY || vars.ODDS_API_KEY || secrets.THE_ODDS_API_KEY || vars.THE_ODDS_API_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY || vars.THE_ODDS_API_KEY || secrets.ODDS_API_KEY || vars.ODDS_API_KEY }}
          ENABLE_THE_ODDS_API: ${{ vars.ENABLE_THE_ODDS_API || 'false' }}
          ODDS_API_LEAGUES: ${{ steps.league_schedule.outputs.odds_api_leagues }}
          ODDS_API_LOOKAHEAD_HOURS: '96'
          ODDS_API_MAX_EVENTS_PER_RUN: '24'
          ODDS_API_PROP_TTL_MIN: '240'
        run: python scripts/odds_adapter.py
      - name: Refresh durable history coverage
        if: needs.clock.outputs.stage == 'MARKET_HISTORY'
        run: python scripts/lsi_history_coverage.py
      - name: Refresh persistent player registry and spectrum cache
        if: needs.clock.outputs.stage == 'MARKET_HISTORY'
        run: python scripts/lsi_history_warehouse.py
      - name: Refresh TTL-gated ESPN player gamelog and split evidence
        if: steps.league_schedule.outputs.cycle_required == 'true'
        continue-on-error: true
        env:
          ESPN_PLAYER_ENRICHMENT_TTL_HOURS: '12'
          ESPN_PLAYER_ENRICHMENT_MAX_PLAYERS: '40'
          ESPN_PLAYER_ENRICHMENT_MAX_WORKERS: '8'
          ESPN_PLAYER_ENRICHMENT_HTTP_TIMEOUT_SEC: '15'
          ESPN_PLAYER_ENRICHMENT_HTTP_ATTEMPTS: '1'
        run: |
          python scripts/test_espn_player_enrichment.py
          python scripts/espn_player_enrichment.py
      - name: Merge verified override evidence before Spectrum
        if: steps.league_schedule.outputs.cycle_required == 'true'
        run: python scripts/lsi_apply_verified_overrides.py
      - name: LEGZ Synthetic Book — internal research shadow only
        if: steps.league_schedule.outputs.cycle_required == 'true'
        run: python scripts/legz_synthetic_book.py
      - name: Validate forecast-first player-prop ladder
        if: steps.league_schedule.outputs.cycle_required == 'true'
        run: python scripts/legz_prop_ladder_test.py
      - name: LEGZ Statistical Spectrum - evaluate collected POMs
        if: steps.league_schedule.outputs.cycle_required == 'true'
        env:
          LSI_FAST_RUNTIME: ${{ needs.clock.outputs.stage == 'DISCOVERY' && 'true' || 'false' }}
        run: |
          python scripts/legz_statistical_spectrum.py
          python - <<'PY'
          import json
          d=json.load(open('data/qc_prop_board.json',encoding='utf-8'))
          assert d.get('evaluation_engine')=='LEGZ_STATISTICAL_SPECTRUM_3'
          props=[p for e in d.get('events',[]) for p in (e.get('props') or [])]
          evaluated=[p for p in props if p.get('evaluation_status')=='LJ_EVALUATED']
          waiting=[p for p in props if p.get('evaluation_status')=='AWAITING_LJ_EVALUATION']
          assert all(p.get('ljpc') is not None for p in evaluated)
          assert all(p.get('ljpc') is None for p in waiting)
          assert all((p.get('spectrum') or {}).get('distribution') is not None for p in props)
          evaluated_projected=[p for p in evaluated if p.get('player_projection')]
          assert len(evaluated_projected)==len(evaluated), f'Evaluated props missing player_projection: {len(evaluated)-len(evaluated_projected)}'
          print('Projection coverage:',d.get('projection_summary') or {})
          assert all(p.get('evaluation_id') and p.get('evaluation_material_hash') and p.get('feature_state') for p in props)
          state=json.load(open('data/lsi_evaluation_state.json',encoding='utf-8'))
          assert state.get('schema_version')=='LSI-EVALUATION-STATE-1'
          ids={r.get('evaluation_id') for r in state.get('records',[]) if r.get('evaluation_id')}
          assert all(p.get('evaluation_id') in ids for p in props)
          import os
          size=os.path.getsize('data/lsi_evaluation_state.json')
          assert state.get('retention_policy')=='LIVE_CURRENT_BOARD_RECORDS_PLUS_LATEST_HASH_INDEX'
          assert size < 80*1024*1024, f'Live evaluation state too large: {size/1024/1024:.2f} MB'
          assert state.get('record_count')==len(state.get('records') or [])
          print(f'Spectrum v3 invariant: {len(evaluated)} evaluated; {len(waiting)} awaiting evidence; durable_live_states={len(ids)}; size_mb={size/1024/1024:.2f}.')
          PY
      - name: Explain forecast-first projection gaps
        if: steps.league_schedule.outputs.cycle_required == 'true'
        run: python scripts/lsi_projection_gap_report.py
      - name: T-48 individualized LJPC coverage and readiness report
        if: steps.league_schedule.outputs.cycle_required == 'true'
        run: |
          python scripts/lsi_t48_coverage.py
          python scripts/lsi_readiness_report.py
      - name: Build and validate Prediction Registry
        if: steps.league_schedule.outputs.cycle_required == 'true'
        run: python scripts/lsi_pipeline.py
      - name: Publish rolling 0-7 day L&J future market board
        if: steps.league_schedule.outputs.cycle_required == 'true'
        run: python scripts/lsi_publish_future_board.py
      - name: LEGZ Game Winner Spectrum — independent performance + market evidence
        if: steps.league_schedule.outputs.cycle_required == 'true'
        env:
          LSI_GAME_WINNER_LEAGUES: ${{ steps.league_schedule.outputs.due_leagues }}
        run: python scripts/lsi_game_winner_spectrum.py
      - name: Per-game QC player-prop completeness audit
        if: steps.league_schedule.outputs.cycle_required == 'true'
        run: node scripts/qc_publication_audit.js
      - name: Snapshot immutable published Quickie tickets
        if: steps.league_schedule.outputs.cycle_required == 'true'
        run: node scripts/lsi_snapshot_tickets.js
      - name: Snapshot immutable website POM and Game Winner suggestions
        if: steps.league_schedule.outputs.cycle_required == 'true'
        run: node scripts/lsi_snapshot_suggestions.js
      - name: OpenAI LSI router — dry run and usage estimate
        if: steps.league_schedule.outputs.cycle_required == 'true'
        run: python scripts/lsi_openai_router.py --dry-run
      - name: Acknowledge completed league/event gates
        if: steps.league_schedule.outputs.has_work == 'true'
        run: python scripts/lsi_league_scheduler.py --ack data/lsi_league_schedule.json
      - name: Market Availability Monitor
        shell: bash
        run: |
          python - <<'PY'
          import csv, json, pathlib
          p=pathlib.Path('data/market_history.csv'); historical={}; game_ml={}
          if p.exists():
            for r in csv.DictReader(p.open()):
              if r.get('market_class')=='PLAYER_PROP':
                historical[r.get('league')]=historical.get(r.get('league'),0)+1
              elif r.get('market_class')=='GAME_ML':
                game_ml[r.get('league')]=game_ml.get(r.get('league'),0)+1
          print('MAM historical PLAYER_PROP observations:',historical)
          print('MAM historical GAME_ML observations:',game_ml)
          board=pathlib.Path('data/qc_prop_board.json')
          if board.exists():
            payload=json.load(board.open(encoding='utf-8'))
            current={}
            for event in payload.get('events',[]):
              league=event.get('league')
              current.setdefault(league,{'events':0,'props':0,'empty':0,'errors':0})
              current[league]['events']+=1
              current[league]['props']+=len(event.get('props') or [])
              if not event.get('props'): current[league]['empty']+=1
              if str(event.get('sweep_status','')).startswith('SOURCE_ERROR'): current[league]['errors']+=1
            print('MAM current event-scoped QC prop board:',current)
            for league,stat in current.items():
              if stat['events'] and stat['props']==0:
                print(f"::warning::MAM: {league} has {stat['events']} discovered event(s) but zero current player props after source sweep.")
              if stat['errors']:
                print(f"::warning::MAM: {league} has {stat['errors']} prop-source error event(s).")
          else:
            print('::warning::MAM: data/qc_prop_board.json not present; event-scoped prop sweep has not produced a board yet.')
          PY
      - name: Validate publication invariants
        run: |
          test -f LJ_index.html && test -f Quickie_Generator.html && test -f data/prediction_registry.json && test -f data/prediction_registry.js
          test -f data/current_game_moneylines.json
          test -f data/qc_ticket_registry.json
          test -f data/suggestion_ledger.json
          test -f data/future_market_board.json && test -f data/future_market_board.js
          test -f data/openai_dry_run_router.json && test -f data/openai_usage_estimates.csv && test -f data/openai_usage_summary.json
          test -f data/lsi_evaluation_state.json
          test -f data/legz_synthetic_book.json
          grep -q 'PLAYER_PROP' data/prediction_registry.json && grep -q 'GAME_ML' data/prediction_registry.json
          grep -q 'DRY_RUN_NO_NETWORK' data/openai_dry_run_router.json
          grep -q 'LSI-QC-TICKETS-1' data/qc_ticket_registry.json
          grep -q 'LSI-SUGGESTION-LEDGER-2' data/suggestion_ledger.json
          grep -q 'LJ-FUTURE-MARKET-1' data/future_market_board.json
          grep -q 'GAME ODDS' lsi_registry_bridge.js
          python - <<'PY'
          import json
          payload=json.load(open('data/prediction_registry.json',encoding='utf-8'))
          assert payload.get('schema_version')=='LSI-PR-2', payload.get('schema_version')
          required=set(payload.get('player_prop_fields') or [])
          assert required, 'PLAYER_PROP field contract missing'
          props=[p for p in payload.get('predictions',[]) if p.get('market_class')=='PLAYER_PROP']
          missing={p.get('prediction_id'):sorted(required-set(p)) for p in props if required-set(p)}
          assert not missing, missing
          assert all(abs(float(p.get('learning_delta') or 0)) <= 3 for p in payload.get('predictions',[]))
          assert all(p.get('ljpc') is not None for p in payload.get('predictions',[])), 'LJPC missing from Prediction Registry'
          assert all(p.get('legz_value') is not None for p in payload.get('predictions',[])), 'LEGZ Value missing from Prediction Registry'
          assert all(p.get('pom_value') is not None for p in payload.get('predictions',[])), 'POM Value missing from Prediction Registry'
          assert all(float(p.get('ljpc'))==float(p.get('lj_probability'))==float(p.get('lj_confidence')) for p in payload.get('predictions',[])), 'LJPC compatibility aliases diverged'
          if payload.get('learning_overlay_enabled'):
              assert any(p.get('learning_applied') for p in payload.get('predictions',[])), 'learning overlay enabled but no prediction received a gated adjustment'
          print(f"LSI-PR-2 invariant: {len(props)} PLAYER_PROP records; learning_enabled={payload.get('learning_overlay_enabled')}")
          board=json.load(open('data/future_market_board.json',encoding='utf-8'))
          active=list(board.get('events') or [])
          actionable=[p for e in active for p in (e.get('props') or []) if p.get('evaluation_status')=='LJ_EVALUATED']
          assert all(p.get('market_verified') is True and p.get('market_verification')=='EXACT_MARKET_MATCH' for p in actionable), 'Actionable POM escaped exact-market verification gate'
          ml_events=[e for e in active if e.get('game_markets')]
          print(f"Future-board invariant: {len(ml_events)}/{len(active)} upcoming event(s) carry GAME_ML odds.")
          if active and not ml_events:
              raise AssertionError('Upcoming market board has events but zero GAME_ML odds; DP/QG moneyline publication would be empty')
          PY
          python scripts/validate_registry.py
      - name: Commit durable LSI outputs
        shell: bash
        run: |
          git config user.name 'LEGZ-JINX LSI'; git config user.email 'actions@users.noreply.github.com'
          outputs=(
            data/prediction_registry.json data/prediction_registry.js data/lsi_evaluation_state.json data/lsi_league_scheduler_state.json
            data/current_game_moneylines.json data/market_history_delta.csv data/event_inventory.csv
            data/performance_history.csv data/weather_history.csv data/venue_coordinates.json data/cfbd data/cfbd_state.json
            data/rotowire_context.csv data/context_registry.json data/kalshi_state.json data/propline_intelligence.json
            data/propline_state.json data/parlayapi_state.json data/oddspapi_history_features.csv data/oddspapi_state.json
            data/oddspapi_market_lookup.json data/qc_prop_board.json data/legz_synthetic_book.json data/future_market_board.json
            data/future_market_board.js data/qc_ticket_registry.json data/suggestion_ledger.json data/the_odds_api_state.json
            data/openai_dry_run_router.json data/openai_usage_estimates.csv data/openai_usage_summary.json
            data/lsi_player_registry.json data/lsi_spectrum_cache.json data/season_schedule_registry.json
            data/team_roster_registry.json data/visual_asset_registry.json data/visual_asset_registry.js
            data/espn_player_registry.json data/espn_event_intelligence.json data/espn_context.csv data/espn_player_enrichment.json
            data/ljpc_coverage.json data/history_coverage.json data/lsi_readiness.json data/game_winner_evidence.json
            data/projection_gap_report.json
          )
          snapshot="$(mktemp -d)"
          for p in "${outputs[@]}"; do
            if [ -e "$p" ]; then
              mkdir -p "$snapshot/$(dirname "$p")"
              cp -a "$p" "$snapshot/$p"
            fi
          done
          if [ -e data/market_history.csv ]; then
            mkdir -p "$snapshot/data"
            cp -a data/market_history.csv "$snapshot/data/market_history.csv"
          fi
          # Generated artifacts are authoritative for this run, while current master
          # is authoritative for code/UI. Overlay the generated snapshot on top of the
          # newest master instead of rebasing million-line generated JSON commits.
          for attempt in 1 2 3 4 5; do
            git fetch origin master
            git reset --hard origin/master
            # Keep the oversized legacy market_history.csv as an immutable base.
            # Persist only observations not already present in base/prior delta.
            if [ -e "$snapshot/data/market_history.csv" ]; then
              python scripts/lsi_market_history_delta.py split "$snapshot/data/market_history.csv"
              mkdir -p "$snapshot/data"
              cp -a data/market_history_delta.csv "$snapshot/data/market_history_delta.csv"
            fi
            for p in "${outputs[@]}"; do
              if [ -e "$snapshot/$p" ]; then
                rm -rf "$p"
                mkdir -p "$(dirname "$p")"
                cp -a "$snapshot/$p" "$p"
              fi
            done
            git add "${outputs[@]}" 2>/dev/null || true
            if git diff --cached --quiet; then
              echo 'No LSI changes to publish.'
              exit 0
            fi
            git commit -m "LSI ${{ needs.clock.outputs.stage }} ${{ needs.clock.outputs.date }} PT"
            LOCAL_SHA="$(git rev-parse HEAD)"
            if git push origin HEAD:master; then
              # Do not treat a successful transport response as publication success.
              # Re-fetch master and require the remote ref to contain the exact commit
              # produced by this run before the pipeline can report success.
              git fetch origin master
              REMOTE_SHA="$(git rev-parse origin/master)"
              if [ "$REMOTE_SHA" = "$LOCAL_SHA" ]; then
                echo "LSI publication verified on master: $LOCAL_SHA"
                exit 0
              fi
              echo "::warning::Push returned success but master verification differed: local=$LOCAL_SHA remote=$REMOTE_SHA"
            fi
            echo "Push race or verification failure; refreshing master and re-overlaying generated outputs (${attempt}/5)."
            sleep 3
          done
          echo "::error::Unable to publish LSI outputs after 5 overlay retries."
          exit 1