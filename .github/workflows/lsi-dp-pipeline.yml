name: LSI Daily Predictions Pipeline

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Publication stage for a manual run
        required: true
        default: DISCOVERY
        type: choice
        options: [DISCOVERY, MORNING_PUBLICATION, MIDDAY_PUBLICATION, MARKET_HISTORY, CONTEXT_MARKETS, MASTER_PUBLICATION]
  push:
    branches: [master]
    paths:
      - 'scripts/odds_adapter.py'
      - 'scripts/propline_adapter.py'
      - 'scripts/oddspapi_history_adapter.py'
      - 'scripts/lsi_pipeline.py'
      - 'scripts/legz_statistical_spectrum.py'
      - 'scripts/nfl_player_history_adapter.py'
      - 'scripts/lsi_history_warehouse.py'
      - 'scripts/lsi_t48_coverage.py'
      - 'scripts/lsi_publish_future_board.py'
      - 'scripts/lsi_promote_learning.py'
      - 'data/learning_overlay.json'
      - 'scripts/qc_publication_audit.js'
      - 'scripts/lsi_snapshot_tickets.js'
      - 'lsi_registry_bridge.js'
      - '.github/workflows/lsi-dp-pipeline.yml'
  schedule:
    - cron: '0 13,16,19,22 * * *'
    - cron: '0 1,4 * * *'
    - cron: '0 14,17,20,23 * * *'
    - cron: '0 2,5 * * *'

permissions:
  contents: write

concurrency:
  group: lsi-dp-pipeline-v2
  cancel-in-progress: true

jobs:
  clock:
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.resolve.outputs.stage }}
      date: ${{ steps.resolve.outputs.date }}
      run_allowed: ${{ steps.resolve.outputs.run_allowed }}
    steps:
      - name: Resolve DST-safe Pacific run stage
        id: resolve
        shell: bash
        env:
          MANUAL_STAGE: ${{ inputs.stage }}
        run: |
          PT_HOUR=$(TZ=America/Los_Angeles date +%H)
          PT_DATE=$(TZ=America/Los_Angeles date +%F)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            STAGE="$MANUAL_STAGE"
            RUN_ALLOWED=true
          elif [ "${{ github.event_name }}" = "push" ]; then
            STAGE=DISCOVERY
            RUN_ALLOWED=true
          else
            case "$PT_HOUR" in
              06) STAGE=DISCOVERY;;
              09) STAGE=MORNING_PUBLICATION;;
              12) STAGE=MIDDAY_PUBLICATION;;
              15) STAGE=MARKET_HISTORY;;
              18) STAGE=CONTEXT_MARKETS;;
              21) STAGE=MASTER_PUBLICATION;;
              *) STAGE=NONCANONICAL_DST_DUPLICATE; RUN_ALLOWED=false;;
            esac
            RUN_ALLOWED=${RUN_ALLOWED:-true}
          fi
          echo "hour=$PT_HOUR" >> "$GITHUB_OUTPUT"
          echo "date=$PT_DATE" >> "$GITHUB_OUTPUT"
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "run_allowed=$RUN_ALLOWED" >> "$GITHUB_OUTPUT"
          echo "Pacific stage: $STAGE; allowed: $RUN_ALLOWED"

  lsi:
    needs: clock
    if: needs.clock.outputs.run_allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: {ref: master, fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Fast PropLine bulk moneyline acquisition
        continue-on-error: true
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY || vars.PROPLINE_API_KEY }}
          PROP_LINE_API_KEY: ${{ secrets.PROP_LINE_API_KEY || vars.PROP_LINE_API_KEY }}
          PROPLINE_HTTP_TIMEOUT_SEC: '8'
          PROPLINE_HTTP_ATTEMPTS: '1'
        run: |
          python scripts/propline_adapter.py --game-odds-only
          python scripts/lsi_publish_future_board.py
          python - <<'PY'
          import json, pathlib
          from datetime import datetime, timezone
          p=pathlib.Path('data/current_game_moneylines.json')
          assert p.exists() and p.stat().st_size>100, 'Fast GAME_ML board missing or empty'
          d=json.load(p.open(encoding='utf-8'))
          assert d.get('schema_version')=='LJ-CURRENT-GAME-ML-1'
          rows=d.get('rows') or []
          events=d.get('events') or []
          assert rows, 'PropLine bulk h2h returned zero current GAME_ML rows'
          assert events, 'PropLine bulk h2h returned GAME_ML rows but no event catalog'
          assert all(e.get('source_event_id') and e.get('commence_time') for e in events), 'Fast GAME_ML event catalog is incomplete'
          usable=[r for r in rows if r.get('market_class')=='GAME_ML' and r.get('event_id') and r.get('participant') and r.get('price') not in (None,'')]
          assert usable, 'Fast GAME_ML artifact has no usable quote rows'
          stamp=datetime.fromisoformat(d['generated_at_utc'].replace('Z','+00:00'))
          age=(datetime.now(timezone.utc)-stamp).total_seconds()/3600
          assert age <= 8, f'Fast GAME_ML artifact is stale: {age:.1f}h'
          board_path=pathlib.Path('data/future_market_board.json')
          js_path=pathlib.Path('data/future_market_board.js')
          assert board_path.stat().st_size>100 and js_path.stat().st_size>100, 'Future market board artifact is empty'
          board=json.load(board_path.open(encoding='utf-8'))
          active=board.get('events',[]) or []
          covered=sum(1 for e in active if e.get('game_markets'))
          fast_ids={str(e.get('source_event_id')) for e in events if e.get('source_event_id')}
          board_ids={str(e.get('source_event_id')) for e in active if e.get('game_markets')}
          missing=sorted(fast_ids-board_ids)
          assert not missing, f'GAME_ML event(s) lost before future board: {missing[:12]}'
          print(f"Fast GAME_ML publication: {len(usable)} usable quote rows; {covered}/{len(active)} future events matched; event catalog={len(events)}; age={age:.2f}h.")
          PY
      - name: Publish fast game lines before prop sweep
        shell: bash
        run: |
          git config user.name 'LEGZ-JINX LSI'; git config user.email 'actions@users.noreply.github.com'
          files=()
          for f in data/current_game_moneylines.json data/future_market_board.json data/future_market_board.js; do
            [ -s "$f" ] && files+=("$f")
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'Fast GAME_ML source unavailable; continuing to fallback acquisition.'
            exit 0
          fi
          git add "${files[@]}"
          if git diff --cached --quiet; then
            echo 'No fast GAME_ML changes to publish.'
          else
            git commit -m "LSI fast GAME_ML ${{ needs.clock.outputs.date }} PT"
            for attempt in 1 2 3; do
              git pull --rebase origin master
              if git push origin master; then break; fi
              if [ "$attempt" = "3" ]; then exit 1; fi
              sleep 2
            done
          fi
      - name: LSI free-first source acquisition
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python scripts/lsi_ingest.py
      - name: RotoWire context acquisition — public RSS first
        env:
          ROTOWIRE_API_KEY: ${{ secrets.ROTOWIRE_API_KEY }}
        run: python scripts/rotowire_adapter.py
      - name: PropLine Level-B prop acquisition — market discovery first
        continue-on-error: true
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY || vars.PROPLINE_API_KEY }}
          PROP_LINE_API_KEY: ${{ secrets.PROP_LINE_API_KEY || vars.PROP_LINE_API_KEY }}
          PROPLINE_ANALYTICS_ENABLED: ${{ vars.PROPLINE_ANALYTICS_ENABLED }}
          PROPLINE_HTTP_TIMEOUT_SEC: '8'
          PROPLINE_HTTP_ATTEMPTS: '1'
        run: python scripts/propline_adapter.py
      - name: OddsPapi historical calibration — free-first
        env:
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
          ODDS_PAPI_API_KEY: ${{ secrets.ODDS_PAPI_API_KEY }}
          LSI_STAGE: ${{ needs.clock.outputs.stage }}
          ODDSPAPI_MAX_DISCOVERY_CALLS: ${{ vars.ODDSPAPI_MAX_DISCOVERY_CALLS }}
          ODDSPAPI_MAX_HISTORY_FIXTURES: ${{ vars.ODDSPAPI_MAX_HISTORY_FIXTURES }}
          ODDSPAPI_MIN_QUOTA_REMAINING: ${{ vars.ODDSPAPI_MIN_QUOTA_REMAINING }}
          ODDSPAPI_BOOKMAKERS: ${{ vars.ODDSPAPI_BOOKMAKERS }}
        run: python scripts/oddspapi_history_adapter.py
      - name: NHL authoritative enrichment
        run: python scripts/nhl_adapter.py
      - name: NFL player-prop fallback — The Odds API
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ENABLE_THE_ODDS_API: 'true'
          ODDS_API_LEAGUES: 'NFL'
          ODDS_API_LOOKAHEAD_HOURS: '96'
          ODDS_API_MAX_EVENTS_PER_RUN: '16'
          ODDS_API_PROP_TTL_MIN: '240'
        run: python scripts/odds_adapter.py
      - name: NFL player-performance hydration — nflverse weekly history
        continue-on-error: true
        run: python scripts/nfl_player_history_adapter.py
      - name: Refresh persistent player registry and spectrum cache
        run: python scripts/lsi_history_warehouse.py
      - name: LEGZ Statistical Spectrum - evaluate collected POMs
        run: |
          python scripts/legz_statistical_spectrum.py
          python - <<'PY'
          import json
          d=json.load(open('data/qc_prop_board.json',encoding='utf-8'))
          assert d.get('evaluation_engine')=='LEGZ_STATISTICAL_SPECTRUM_2'
          props=[p for e in d.get('events',[]) for p in (e.get('props') or [])]
          evaluated=[p for p in props if p.get('evaluation_status')=='LJ_EVALUATED']
          waiting=[p for p in props if p.get('evaluation_status')=='AWAITING_LJ_EVALUATION']
          assert all(p.get('ljpc') is not None for p in evaluated)
          assert all(p.get('ljpc') is None for p in waiting)
          assert all((p.get('spectrum') or {}).get('distribution') is not None for p in props)
          print(f'Spectrum v2 invariant: {len(evaluated)} evaluated; {len(waiting)} awaiting evidence.')
          PY
      - name: T-48 individualized LJPC coverage report
        run: python scripts/lsi_t48_coverage.py
      - name: Build and validate Prediction Registry
        run: python scripts/lsi_pipeline.py
      - name: Publish rolling 0-7 day L&J future market board
        run: python scripts/lsi_publish_future_board.py
      - name: Per-game QC player-prop completeness audit
        run: node scripts/qc_publication_audit.js
      - name: Snapshot immutable published Quickie tickets
        run: node scripts/lsi_snapshot_tickets.js
      - name: OpenAI LSI router — dry run and usage estimate
        run: python scripts/lsi_openai_router.py --dry-run
      - name: Market Availability Monitor
        shell: bash
        run: |
          python - <<'PY'
          import csv, json, pathlib
          p=pathlib.Path('data/market_history.csv'); historical={}; game_ml={}
          if p.exists():
            for r in csv.DictReader(p.open()):
              if r.get('market_class')=='PLAYER_PROP':
                historical[r.get('league')]=historical.get(r.get('league'),0)+1
              elif r.get('market_class')=='GAME_ML':
                game_ml[r.get('league')]=game_ml.get(r.get('league'),0)+1
          print('MAM historical PLAYER_PROP observations:',historical)
          print('MAM historical GAME_ML observations:',game_ml)
          board=pathlib.Path('data/qc_prop_board.json')
          if board.exists():
            payload=json.load(board.open(encoding='utf-8'))
            current={}
            for event in payload.get('events',[]):
              league=event.get('league')
              current.setdefault(league,{'events':0,'props':0,'empty':0,'errors':0})
              current[league]['events']+=1
              current[league]['props']+=len(event.get('props') or [])
              if not event.get('props'): current[league]['empty']+=1
              if str(event.get('sweep_status','')).startswith('SOURCE_ERROR'): current[league]['errors']+=1
            print('MAM current event-scoped QC prop board:',current)
            for league,stat in current.items():
              if stat['events'] and stat['props']==0:
                print(f"::warning::MAM: {league} has {stat['events']} discovered event(s) but zero current player props after source sweep.")
              if stat['errors']:
                print(f"::warning::MAM: {league} has {stat['errors']} prop-source error event(s).")
          else:
            print('::warning::MAM: data/qc_prop_board.json not present; event-scoped prop sweep has not produced a board yet.')
          PY
      - name: Validate publication invariants
        run: |
          test -f LJ_index.html && test -f Quickie_Generator.html && test -f data/prediction_registry.json && test -f data/prediction_registry.js
          test -f data/current_game_moneylines.json
          test -f data/qc_ticket_registry.json
          test -f data/future_market_board.json && test -f data/future_market_board.js
          test -f data/openai_dry_run_router.json && test -f data/openai_usage_estimates.csv && test -f data/openai_usage_summary.json
          grep -q 'PLAYER_PROP' data/prediction_registry.json && grep -q 'GAME_ML' data/prediction_registry.json
          grep -q 'DRY_RUN_NO_NETWORK' data/openai_dry_run_router.json
          grep -q 'LSI-QC-TICKETS-1' data/qc_ticket_registry.json
          grep -q 'LJ-FUTURE-MARKET-1' data/future_market_board.json
          grep -q 'GAME ODDS' lsi_registry_bridge.js
          python - <<'PY'
          import json
          payload=json.load(open('data/prediction_registry.json',encoding='utf-8'))
          assert payload.get('schema_version')=='LSI-PR-2', payload.get('schema_version')
          required=set(payload.get('player_prop_fields') or [])
          assert required, 'PLAYER_PROP field contract missing'
          props=[p for p in payload.get('predictions',[]) if p.get('market_class')=='PLAYER_PROP']
          missing={p.get('prediction_id'):sorted(required-set(p)) for p in props if required-set(p)}
          assert not missing, missing
          assert all(abs(float(p.get('learning_delta') or 0)) <= 3 for p in payload.get('predictions',[]))
          assert all(p.get('ljpc') is not None for p in payload.get('predictions',[])), 'LJPC missing from Prediction Registry'
          assert all(p.get('legz_value') is not None for p in payload.get('predictions',[])), 'LEGZ Value missing from Prediction Registry'
          assert all(p.get('pom_value') is not None for p in payload.get('predictions',[])), 'POM Value missing from Prediction Registry'
          assert all(float(p.get('ljpc'))==float(p.get('lj_probability'))==float(p.get('lj_confidence')) for p in payload.get('predictions',[])), 'LJPC compatibility aliases diverged'
          if payload.get('learning_overlay_enabled'):
              assert any(p.get('learning_applied') for p in payload.get('predictions',[])), 'learning overlay enabled but no prediction received a gated adjustment'
          print(f"LSI-PR-2 invariant: {len(props)} PLAYER_PROP records; learning_enabled={payload.get('learning_overlay_enabled')}")
          board=json.load(open('data/future_market_board.json',encoding='utf-8'))
          active=list(board.get('events') or [])
          ml_events=[e for e in active if e.get('game_markets')]
          print(f"Future-board invariant: {len(ml_events)}/{len(active)} upcoming event(s) carry GAME_ML odds.")
          if active and not ml_events:
              raise AssertionError('Upcoming market board has events but zero GAME_ML odds; DP/QG moneyline publication would be empty')
          PY
          python scripts/validate_registry.py
      - name: Commit durable LSI outputs
        shell: bash
        run: |
          git config user.name 'LEGZ-JINX LSI'; git config user.email 'actions@users.noreply.github.com'
          git add data/prediction_registry.json data/prediction_registry.js data/current_game_moneylines.json data/market_history.csv data/event_inventory.csv data/weather_history.csv data/venue_coordinates.json data/cfbd data/cfbd_state.json data/rotowire_context.csv data/context_registry.json data/propline_intelligence.json data/propline_state.json data/oddspapi_history_features.csv data/oddspapi_state.json data/oddspapi_market_lookup.json data/qc_prop_board.json data/future_market_board.json data/future_market_board.js data/qc_ticket_registry.json data/the_odds_api_state.json data/openai_dry_run_router.json data/openai_usage_estimates.csv data/openai_usage_summary.json data/lsi_player_registry.json data/lsi_spectrum_cache.json data/ljpc_coverage.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No LSI changes to publish.'
          else
            git commit -m "LSI ${{ needs.clock.outputs.stage }} ${{ needs.clock.outputs.date }} PT"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin master
              if git push origin master; then exit 0; fi
              echo "Push race detected; retrying attempt ${attempt}/5 after refresh."
              sleep 3
            done
            echo "::error::Unable to publish LSI outputs after 5 push retries."
            exit 1
          fi