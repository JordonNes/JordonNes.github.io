<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LEGZ & JINX — Quickie Generator</title>
<link rel="stylesheet" href="ljstyle.css"><link rel="stylesheet" href="ljqc.css?v=20260916-quickie1">
<style>
.quickie-shell{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px;align-items:start}.generator-stage{min-width:0}.filter-rail{position:sticky;top:12px;border:1px solid rgba(255,255,255,.13);border-radius:14px;background:rgba(15,15,20,.96);padding:14px}.filter-rail h3{margin:0 0 10px;font-size:.92rem;letter-spacing:.08em}.filter-group{border-top:1px solid rgba(255,255,255,.1);padding:11px 0}.filter-group:first-of-type{border-top:0}.filter-label{display:block;font-size:.72rem;font-weight:800;letter-spacing:.08em;margin-bottom:7px;opacity:.78}.filter-row{display:flex;gap:7px;flex-wrap:wrap}.filter-row label,.sport-pick{font-size:.78rem;display:flex;align-items:center;gap:5px}.filter-rail select,.filter-rail button{width:100%;border-radius:9px;padding:9px;border:1px solid rgba(255,255,255,.16);background:#17171d;color:inherit}.filter-rail button{font-weight:900;cursor:pointer;background:#f4c542;color:#111;border:0}.sport-list{display:grid;grid-template-columns:1fr 1fr;gap:6px}.generator-note{font-size:.74rem;line-height:1.35;opacity:.72;margin-top:8px}.parlay-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.parlay-card{border:1px solid rgba(255,255,255,.13);border-radius:14px;overflow:hidden;background:rgba(255,255,255,.035)}.parlay-head{padding:12px 14px;font-weight:900;background:#f4c542;color:#111}.parlay-body{padding:12px 14px}.parlay-leg{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.09)}.parlay-leg:last-child{border-bottom:0}.leg-main{font-weight:800}.leg-sub{font-size:.76rem;opacity:.72;margin-top:3px}.empty-state{padding:28px;border:1px dashed rgba(255,255,255,.2);border-radius:14px;text-align:center}.pool-count{font-size:.78rem;opacity:.72;margin:0 0 12px}@media(max-width:820px){.quickie-shell{grid-template-columns:1fr}.filter-rail{position:static;order:-1}.parlay-grid{grid-template-columns:1fr}.sport-list{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body><div id="app"></div>
<script src="ljdata.js?v=20260916-noon1"></script><script src="nflrefresh.js?v=20260916-noon1"></script><script src="ncaarefresh.js?v=20260916-noon1"></script><script src="tennisrefresh.js?v=20260916-noon1"></script><script src="dailyrefresh.js?v=20260916-noon1"></script><script src="morningrefresh.js?v=20260916-noon1"></script><script src="middayrefresh.js?v=20260916-noon1"></script>
<script>
(()=>{
const D=window.LJ_DATA||{}, app=document.getElementById('app');
const sportOrder=['MLB','NFL','NBA','WNBA','NHL','FIBA_Men','FIBA_Women','NCAA_Football','NCAA_Basketball','UFC','Boxing','Tennis'];
const sportNames={FIBA_Men:'FIBA MEN',FIBA_Women:'FIBA WOMEN',NCAA_Football:'NCAA FOOTBALL',NCAA_Basketball:'NCAA BASKETBALL'};
const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=v=>Number(String(v||'').match(/\d+(?:\.\d+)?/)?.[0]||0);
const watch=v=>/WATCH|NO BET|PASS|CLOSED|STARTED|LIVE|UNSUPPORTED|VERIFY LIVE LINE|MARKET NOT|DATA-LIMITED/i.test(String(v||''));
function header(){return `<div class="page"><div class="topbar"><a class="lj-mini" href="LJ_index.html">L&amp;J</a><div class="meta">${esc(D.updated||'LATEST DAILY PREDICTIONS COLLECTION')}</div></div><section class="hero"><div class="kicker">LEGZ &amp; JINX DAILY PREDICTIONS</div><h1>L&amp;J QUICKIE GENERATOR</h1><p>Build 1–2 requested parlays from the latest published L&amp;J Daily Predictions pool. Choose 2–6 legs, prediction type, risk tier, and up to six sports/leagues.</p><div class="chips"><span class="chip green">LATEST DP POOL</span><span class="chip gold">2–6 LEGS</span><span class="chip purple">1–2 PARLAYS</span></div><div class="actions"><a class="action" href="LJ_index.html">← Daily Home</a><a class="action" href="Recap.html">📊 Yesterday's Recap</a></div></section><section class="section"><div class="section-head"><h2>QUICKIE BUILDER</h2><span class="muted">Filters select from published predictions only — no new line is invented here</span></div><div class="quickie-shell"><main class="generator-stage"><p class="pool-count" id="poolCount"></p><div class="parlay-grid" id="results"></div></main>${filters()}</div></section></div>`}
function filters(){return `<aside class="filter-rail"><h3>QUICKIE FILTERS</h3><div class="filter-group"><span class="filter-label">PARLAYS</span><select id="parlayCount"><option value="1">1 parlay</option><option value="2">2 parlays</option></select></div><div class="filter-group"><span class="filter-label">LEGS EACH</span><select id="legCount">${[2,3,4,5,6].map(n=>`<option value="${n}" ${n===4?'selected':''}>${n} legs</option>`).join('')}</select></div><div class="filter-group"><span class="filter-label">PREDICTION TYPE</span><div class="filter-row"><label><input type="checkbox" name="kind" value="PROP" checked> Player props</label><label><input type="checkbox" name="kind" value="ML" checked> ML</label><label><input type="checkbox" name="kind" value="TEAM" checked> Team odds</label></div></div><div class="filter-group"><span class="filter-label">L&amp;J STYLE</span><select id="tier"><option value="SNS">SNS</option><option value="NORMAL" selected>Normal</option><option value="AGGRESSIVE">Aggressive</option></select></div><div class="filter-group"><span class="filter-label">SPORTS / LEAGUES — SELECT 1–6</span><div class="sport-list">${sportOrder.map((k,i)=>`<label class="sport-pick"><input type="checkbox" name="sport" value="${k}" ${i<6?'checked':''}> ${esc(sportNames[k]||k)}</label>`).join('')}</div></div><button id="generate">GENERATE QUICKIE</button><div class="generator-note">SNS favors the highest-confidence available legs. Normal balances confidence and variety. Aggressive favors lower-confidence/upside expressions already present in the current publication. Generator output is a remix of L&amp;J's latest published collection, not a live sportsbook quote.</div></aside>`}
function add(pool,seen,item){if(!item.pick||watch(item.pick+' '+item.context))return;const key=(item.sport+'|'+item.pick).toLowerCase();if(seen.has(key))return;seen.add(key);pool.push(item)}
function buildPool(){const pool=[],seen=new Set();sportOrder.forEach(sport=>{const s=D.sports?.[sport];if(!s)return;(s.hotTop||[]).forEach(r=>add(pool,seen,{sport,kind:'PROP',pick:`${r[0]} — ${r[1]}`,conf:pct(r[2]),context:r[3]||'LEGZ HOT TOP'}));(s.winners||[]).forEach(r=>add(pool,seen,{sport,kind:'ML',pick:`${r[0]} — ${r[1]}`,conf:pct(r[2]),context:r[3]||'JINX GAME WINNER'}));(s.qcs||[]).forEach(q=>{if(q.winner&&!watch(q.winner))add(pool,seen,{sport,kind:'ML',pick:`${q.away||''} @ ${q.home||''} — ${q.winner}`,conf:pct(q.conf),context:q.market||q.time||'Per-Game QC'});const teamText=[q.market,q.normal,q.demon].filter(Boolean);teamText.forEach(t=>{if(/spread|total|team total|\bo\s?\d|\bu\s?\d|\+\d|-\d/i.test(t)&&!/yards|points|rebounds|assists|strikeouts|hits|receptions|rush|pass|shots|saves/i.test(t))add(pool,seen,{sport,kind:'TEAM',pick:`${q.away||''} @ ${q.home||''} — ${t}`,conf:pct(q.conf),context:'Per-Game QC team market'})});[q.hot,q.sns1,q.sns2,q.normal,q.demon].filter(Boolean).forEach(t=>{if(!watch(t)&&/yards|points|rebounds|assists|strikeouts|hits|receptions|rush|pass|shots|saves|PRA|TD|HR|RBI|threes|blocks/i.test(t))add(pool,seen,{sport,kind:'PROP',pick:t,conf:pct(q.conf),context:`${q.away||''} @ ${q.home||''} QC`})})})});return pool}
function seededSort(a,b,tier){if(tier==='SNS')return b.conf-a.conf;if(tier==='AGGRESSIVE')return (a.conf||50)-(b.conf||50);return Math.abs((b.conf||65)-68)-Math.abs((a.conf||65)-68)}
function generate(){const sports=[...document.querySelectorAll('input[name=sport]:checked')].map(x=>x.value),kinds=[...document.querySelectorAll('input[name=kind]:checked')].map(x=>x.value),pc=+document.getElementById('parlayCount').value,lc=+document.getElementById('legCount').value,tier=document.getElementById('tier').value,res=document.getElementById('results'),count=document.getElementById('poolCount');if(sports.length<1||sports.length>6){res.innerHTML='<div class="empty-state">Select between 1 and 6 sports/leagues.</div>';return}if(!kinds.length){res.innerHTML='<div class="empty-state">Select at least one prediction type.</div>';return}let pool=buildPool().filter(x=>sports.includes(x.sport)&&kinds.includes(x.kind));pool.sort((a,b)=>seededSort(a,b,tier));count.textContent=`${pool.length} current supportable prediction${pool.length===1?'':'s'} match your filters.`;if(pool.length<lc){res.innerHTML=`<div class="empty-state">Only ${pool.length} current prediction${pool.length===1?'':'s'} cleared these filters. Reduce the leg count, add a prediction type, or select another active sport.</div>`;return}const used=new Set(),cards=[];for(let p=0;p<pc;p++){const legs=[];for(const x of pool){if(legs.length>=lc)break;const key=x.sport+'|'+x.pick;if(used.has(key)&&pool.length>=pc*lc)continue;legs.push(x);used.add(key)}if(legs.length<lc)break;cards.push(`<article class="parlay-card"><div class="parlay-head">${tier} QUICKIE ${p+1} • ${lc} LEGS</div><div class="parlay-body">${legs.map((x,i)=>`<div class="parlay-leg"><div class="leg-main">${i+1}. ${esc(sportNames[x.sport]||x.sport)} • ${esc(x.pick)}</div><div class="leg-sub">${x.conf?`L&amp;J confidence ${esc(x.conf)}% • `:''}${esc(x.kind==='PROP'?'Player / participant prop':x.kind==='ML'?'Moneyline / winner':'Team odds')} • ${esc(x.context)}</div></div>`).join('')}</div></article>`)}res.innerHTML=cards.join('')||'<div class="empty-state">The current publication pool cannot build this request without reusing or inventing a leg.</div>'}
app.innerHTML=header();document.querySelectorAll('input[name=sport]').forEach(x=>x.addEventListener('change',()=>{const c=document.querySelectorAll('input[name=sport]:checked').length;if(c>6)x.checked=false}));document.getElementById('generate').addEventListener('click',generate);generate();
})();
</script></body></html>
