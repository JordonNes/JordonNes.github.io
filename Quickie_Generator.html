.quickie-shell{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px;align-items:start}.generator-stage{min-width:0}.filter-rail{position:sticky;top:12px;border:1px solid rgba(255,255,255,.13);border-radius:14px;background:rgba(15,15,20,.96);padding:14px}.filter-rail h3{margin:0 0 10px;font-size:.92rem;letter-spacing:.08em}.filter-group{border-top:1px solid rgba(255,255,255,.1);padding:11px 0}.filter-group:first-of-type{border-top:0}.filter-label{display:block;font-size:.72rem;font-weight:800;letter-spacing:.08em;margin-bottom:7px;opacity:.78}.filter-row{display:flex;gap:7px;flex-wrap:wrap}.filter-row label,.sport-pick{font-size:.78rem;display:flex;align-items:center;gap:5px}.filter-rail select,.filter-rail button{width:100%;border-radius:9px;padding:9px;border:1px solid rgba(255,255,255,.16);background:#17171d;color:inherit}.filter-rail button{font-weight:900;cursor:pointer;background:#f4c542;color:#111;border:0}.sport-list{display:grid;grid-template-columns:1fr 1fr;gap:6px}.generator-note{font-size:.74rem;line-height:1.35;opacity:.72;margin-top:8px}.parlay-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.parlay-card{border:1px solid rgba(255,255,255,.13);border-radius:14px;overflow:hidden;background:rgba(255,255,255,.035)}.parlay-head{padding:12px 14px;font-weight:900;background:#f4c542;color:#111}.parlay-body{padding:12px 14px}.parlay-leg{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.09)}.parlay-leg:last-child{border-bottom:0}.leg-main{font-weight:800}.leg-sub{font-size:.76rem;opacity:.8;margin-top:3px}.legz{color:#55d889;font-weight:900}.jinx{color:#bd78ff;font-weight:900}.delta{font-weight:900}.empty-state{padding:28px;border:1px dashed rgba(255,255,255,.2);border-radius:14px;text-align:center}.pool-count{font-size:.78rem;opacity:.72;margin:0 0 12px}@media(max-width:820px){.quickie-shell{grid-template-columns:1fr}.filter-rail{position:static;order:-1}.parlay-grid{grid-template-columns:1fr}.sport-list{grid-template-columns:repeat(3,1fr)}}

<script src="ljdata.js?v=20260917-mma3"></script><script src="nflrefresh.js?v=20260916-noon1"></script><script src="ncaarefresh.js?v=20260916-noon1"></script><script src="tennisrefresh.js?v=20260916-noon1"></script><script src="dailyrefresh.js?v=20260916-noon1"></script><script src="morningrefresh.js?v=20260916-noon1"></script><script src="middayrefresh.js?v=20260916-noon1"></script><script src="data/future_market_board.js?v=20260918-moneyline2"></script><script src="data/prediction_registry.js?v=20260918-rolling7d1"></script><script src="lsi_registry_bridge.js?v=20260918-moneyline2"></script>
<script>
(()=>{const D=window.LJ_DATA||{},app=document.getElementById('app');const sportOrder=['MLB','NFL','NBA','WNBA','NHL','FIBA_Men','FIBA_Women','NCAA_Football','NCAA_Basketball','MMA','Boxing','Tennis'];const sportNames={FIBA_Men:'FIBA MEN',FIBA_Women:'FIBA WOMEN',NCAA_Football:'NCAA FOOTBALL',NCAA_Basketball:'NCAA BASKETBALL'};const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const pct=v=>Number(String(v||'').match(/\d+(?:\.\d+)?/)?.[0]||0);const watch=v=>/WATCH|NO BET|^PASS\\b|CLOSED|STARTED|LIVE|UNSUPPORTED|VERIFY LIVE LINE|MARKET NOT|DATA-LIMITED/i.test(String(v||''));const propRx=/yards|points|rebounds|assists|strikeouts|\bks\b|hits|receptions|rush|passing|receiving|shots|saves|PRA|TD|touchdown|HR|RBI|threes|blocks|aces|games won|sets won/i;const teamRx=/spread|game total|team total|\bo\s?\d|\bu\s?\d|\+\d|-\d/i;
function header(){return `<div class="page quickie-page"><div class="topbar"><a class="lj-mini" href="LJ_index.html">L&amp;J</a><div class="meta">${esc(D.updated||'LATEST DAILY PREDICTIONS COLLECTION')}</div></div><section class="hero"><div class="kicker">LEGZ &amp; JINX DAILY PREDICTIONS</div><h1>L&amp;J QUICKIE GENERATOR</h1><p>Build 1–2 parlays from L&amp;J-evaluated markets for upcoming events in the next 0–7 days. Filters use typed markets so a game winner can never be returned as a player prop.</p><div class="chips"><span class="chip green">ROLLING 0–7 DAY POOL</span><span class="chip gold">2–6 LEGS</span><span class="chip purple">JINX BEST BETS</span></div><div class="actions"><a class="action" href="LJ_index.html">← Daily Home</a><a class="action" href="Recap.html">📊 Yesterday's Recap</a></div></section><section class="section"><div class="section-head"><h2>QUICKIE BUILDER</h2><span class="muted">L&amp;J-evaluated upcoming markets only — completed events are excluded</span></div><div class="quickie-shell"><main class="generator-stage"><p class="pool-count" id="poolCount"></p><div class="parlay-grid" id="results"></div></main>${filters()}</div></section></div>`}
function filters(){return `<aside class="filter-rail"><h3>QUICKIE FILTERS</h3><div class="filter-group"><span class="filter-label">PARLAYS</span><select id="parlayCount"><option value="1">1 parlay</option><option value="2">2 parlays</option></select></div><div class="filter-group"><span class="filter-label">LEGS EACH</span><select id="legCount">${[2,3,4,5,6].map(n=>`<option value="${n}" ${n===4?'selected':''}>${n} legs</option>`).join('')}</select></div><div class="filter-group"><span class="filter-label">PREDICTION TYPE</span><div class="filter-row"><label><input type="checkbox" name="kind" value="PLAYER_PROP" checked> Player props</label><label><input type="checkbox" name="kind" value="GAME_ML" checked> ML</label><label><input type="checkbox" name="kind" value="TEAM_ODDS" checked> Team odds</label></div></div><div class="filter-group"><span class="filter-label">L&amp;J STYLE</span><select id="tier"><option value="SNS">SNS</option><option value="NORMAL" selected>Normal</option><option value="AGGRESSIVE">Aggressive</option><option value="BEST">Jinx Best Bets</option></select></div><div class="filter-group"><span class="filter-label">SPORTS / LEAGUES — SELECT 1–6</span><div class="sport-list">${sportOrder.map((k,i)=>`<label class="sport-pick"><input type="checkbox" name="sport" value="${k}" ${i<6?'checked':''}> ${esc(sportNames[k]||k)}</label>`).join('')}</div></div><button id="generate">GENERATE QUICKIE</button><div class="generator-note">Jinx Best Bets ranks the strongest available published legs across your allowed market types and selected sports. Player Props means player/participant markets only; ML means game/match winner only; Team Odds means spread/total/team-total markets.</div></aside>`}
function add(pool,seen,item){if(!item.pick||watch(item.pick+' '+item.context))return;const key=(item.sport+'|'+item.marketClass+'|'+item.pick).toLowerCase();if(seen.has(key))return;seen.add(key);pool.push(item)}
function buildPool(){const pool=[],seen=new Set(),now=Date.now(),horizon=now+7*86400000,R=window.LSI_PR,B=window.LJ_FUTURE_MARKET_BOARD;
const future=p=>{const t=Date.parse(p?.event_start_pt||'');return Number.isFinite(t)&&t>now&&t<=horizon};
if(Array.isArray(R?.predictions))R.predictions.filter(future).forEach(p=>{const mc=String(p.market_class||'');if(!['PLAYER_PROP','GAME_ML','SPREAD','GAME_TOTAL','TEAM_TOTAL'].includes(mc))return;const cls=mc==='PLAYER_PROP'?'PLAYER_PROP':mc==='GAME_ML'?'GAME_ML':'TEAM_ODDS';const pick=p.pick||p.selection;const price=p.price?(' • '+p.price):'';add(pool,seen,{sport:p.league,marketClass:cls,pick:pick+price,legz:Number(p.legz_confidence??p.lj_confidence??p.lj_probability??0),jinxDelta:Number(p.jinx_input||0),context:'Canonical L&J Registry • '+(p.model_version||'model')})});
if(Array.isArray(B?.events))B.events.forEach(e=>{const t=Date.parse(e?.commence_time||'');if(!Number.isFinite(t)||t<=now||t>horizon)return;const sides=[...(e.game_markets||[])].sort((a,b)=>Number(b.lj_confidence||0)-Number(a.lj_confidence||0));const best=sides[0];if(!best)return;const price=best.price!==null&&best.price!==undefined&&best.price!==''?(' • '+(Number(best.price)>0?'+':'')+best.price+(best.book?' '+best.book:'')):'';const boardOdds=sides.slice(0,3).map(s=>String(s.participant||s.selection||'Side')+' '+(s.price!==null&&s.price!==undefined&&s.price!==''?((Number(s.price)>0?'+':'')+s.price):'price recheck')).join(' • ');add(pool,seen,{sport:e.league,marketClass:'GAME_ML',pick:(e.away||'')+' @ '+(e.home||'')+' — '+(best.selection||best.participant)+' ML'+price,legz:Number(best.lj_confidence||0),jinxDelta:0,directLj:true,context:'Future Market Board • '+boardOdds+' • L&J MODEL: MARKET BASELINE'})});
sportOrder.forEach(sport=>{const s=D.sports?.[sport];if(!s)return;(s.hotTop||[]).forEach(r=>{const text=`${r[0]} — ${r[1]}`;if(propRx.test(text))add(pool,seen,{sport,marketClass:'PLAYER_PROP',pick:text,legz:pct(r[2]),jinxDelta:0,context:r[3]||'LEGZ HOT TOP'})});(s.winners||[]).forEach(r=>add(pool,seen,{sport,marketClass:'GAME_ML',pick:`${r[0]} — ${r[1]}`,legz:pct(r[2]),jinxDelta:0,directLj:true,context:r[3]||'JINX GAME WINNER'}));(s.qcs||[]).forEach(q=>{if(q.winner&&!watch(q.winner)&&pct(q.conf)>0)add(pool,seen,{sport,marketClass:'GAME_ML',pick:`${q.away||''} @ ${q.home||''} — ${q.winner}`,legz:pct(q.conf),jinxDelta:0,directLj:true,context:q.market||q.time||'Per-Game QC'});[q.hot,q.sns1,q.sns2,q.normal,q.demon].filter(Boolean).flatMap(x=>Array.isArray(x)?x:[x]).forEach(t=>{const conf=pct(t);if(!watch(t)&&propRx.test(t)&&conf>0)add(pool,seen,{sport,marketClass:'PLAYER_PROP',pick:String(t),legz:conf,jinxDelta:0,context:`${q.away||''} @ ${q.home||''} • ${q.time||'upcoming'}`})})})});return pool}
function score(x,tier){const combined=Math.max(0,Math.min(110,x.legz+x.jinxDelta));if(tier==='SNS')return combined;if(tier==='AGGRESSIVE')return 100-Math.abs(combined-56);if(tier==='BEST')return combined+(x.marketClass==='PLAYER_PROP'?1:0);return 100-Math.abs(combined-68)}
function confHTML(x){const total=Math.max(0,Math.min(110,x.legz+x.jinxDelta));if(x.directLj)return `<b>L&amp;J model confidence ${total}%</b>`;const sign=x.jinxDelta>=0?'+':'−',j=Math.abs(x.jinxDelta);return `<span class="legz">Legz confidence ${x.legz}%</span> <span class="delta">${sign}</span> <span class="jinx">Jinx input ${j}%</span> = <b>L&amp;J ${total}%</b>`}
function generate(){const sports=[...document.querySelectorAll('input[name=sport]:checked')].map(x=>x.value),kinds=[...document.querySelectorAll('input[name=kind]:checked')].map(x=>x.value),pc=+document.getElementById('parlayCount').value,lc=+document.getElementById('legCount').value,tier=document.getElementById('tier').value,res=document.getElementById('results'),count=document.getElementById('poolCount');if(sports.length<1||sports.length>6){res.innerHTML='<div class="empty-state">Select between 1 and 6 sports/leagues.</div>';return}if(!kinds.length){res.innerHTML='<div class="empty-state">Select at least one prediction type.</div>';return}let pool=buildPool().filter(x=>sports.includes(x.sport)&&kinds.includes(x.marketClass));pool.sort((a,b)=>score(b,tier)-score(a,tier));count.textContent=`${pool.length} upcoming L&J-evaluated prediction${pool.length===1?'':'s'} match your filters.`;if(pool.length<lc){res.innerHTML=`<div class="empty-state">Only ${pool.length} current prediction${pool.length===1?'':'s'} cleared these filters. Reduce the leg count or broaden the filters.</div>`;return}const used=new Set(),cards=[];for(let p=0;p<pc;p++){const legs=[];for(const x of pool){if(legs.length>=lc)break;const key=x.sport+'|'+x.pick;if(used.has(key)&&pool.length>=pc*lc)continue;legs.push(x);used.add(key)}if(legs.length<lc)break;const title=tier==='BEST'?'JINX BEST BETS':tier;cards.push(`<article class="parlay-card"><div class="parlay-head">${title} QUICKIE ${p+1} • ${lc} LEGS</div><div class="parlay-body">${legs.map((x,i)=>`<div class="parlay-leg"><div class="leg-main">${i+1}. ${esc(sportNames[x.sport]||x.sport)} • ${esc(x.pick)}</div><div class="leg-sub">${confHTML(x)}<br>${esc(x.marketClass==='PLAYER_PROP'?'Player / participant prop':x.marketClass==='GAME_ML'?'Moneyline / winner':'Team odds')} • ${esc(x.context)}</div></div>`).join('')}</div></article>`)}res.innerHTML=cards.join('')||'<div class="empty-state">The current publication pool cannot build this request without reusing or inventing a leg.</div>'}
app.innerHTML=header();document.querySelectorAll('input[name=sport]').forEach(x=>x.addEventListener('change',()=>{const c=document.querySelectorAll('input[name=sport]:checked').length;if(c>6)x.checked=false}));document.getElementById('generate').addEventListener('click',generate);generate();})();
</script><script src="recaplink.js?v=20260917-headerstandard1"></script></body></html>
