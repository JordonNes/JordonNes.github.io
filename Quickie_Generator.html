olumns:repeat(3,1fr)}}

<script>
(()=>{const D=window.LJ_DATA||{},app=document.getElementById('app');const sportOrder=['MLB','NFL','NBA','WNBA','NHL','FIBA','NCAA_Football','NCAA_Basketball','MMA','Boxing','Tennis'];const sportNames={FIBA:'FIBA',FIBA_Men:'FIBA MEN',FIBA_Women:'FIBA WOMEN',NCAA_Football:'CFB',NCAA_Basketball:'CBB'};const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const pct=v=>Number(String(v||'').match(/\d+(?:\.\d+)?/)?.[0]||0);const fmtPrice=(v,book='')=>{const x=Number(v);if(!Number.isFinite(x)||x===0)return'';return `${x>0?'+':''}${x}${book?` ${String(book).replace(/^PROPLINE[:|]/i,'PROPLINE|')}`:''}`};const watch=v=>/WATCH|NO BET|^PASS\\b|CLOSED|STARTED|LIVE|UNSUPPORTED|VERIFY LIVE LINE|MARKET NOT|DATA-LIMITED/i.test(String(v||''));const propRx=/yards|points|rebounds|assists|strikeouts|\bks\b|hits|receptions|rush|passing|receiving|shots|saves|PRA|TD|touchdown|HR|RBI|threes|blocks|aces|games won|sets won/i;const teamRx=/spread|game total|team total|\bo\s?\d|\bu\s?\d|\+\d|-\d/i;
function header(){return `<div class="page quickie-page"><div class="topbar"><a class="lj-mini" href="LJ_index.html">L&amp;J</a><div class="meta">${esc(D.updated||'LATEST DAILY PREDICTIONS COLLECTION')}</div></div><section class="hero"><div class="kicker">LEGZ &amp; JINX DAILY PREDICTIONS</div><h1>L&amp;J QUICKIE GENERATOR</h1><p>Build 1–2 parlays from L&amp;J-evaluated markets for upcoming events in the next 0–7 days. Filters use typed markets so a game winner can never be returned as a player prop.</p><div class="chips"><span class="chip green">ROLLING 0–7 DAY POOL</span><span class="chip gold">2–6 LEGS</span><span class="chip purple">JINX BEST BETS</span></div><div class="actions"><a class="action" href="LJ_index.html">← Daily Home</a><a class="action" href="Recap.html">📊 Yesterday's Recap</a><a class="action" href="LJ_Methodology.html">Methodology / Glossary</a></div></section><section class="section"><div class="section-head"><h2>QUICKIE BUILDER</h2><span class="muted">L&amp;J-evaluated upcoming markets only — completed events are excluded</span></div><div class="quickie-shell"><main class="generator-stage"><p class="pool-count" id="poolCount"></p><div class="parlay-grid" id="results"></div></main>${filters()}</div></section></div>`}
function availability(){
  const pool=buildPool(), counts={PLAYER_PROP:0,GAME_ML:0,TEAM_ODDS:0}, sports={};
  for(const x of pool){counts[x.marketClass]=(counts[x.marketClass]||0)+1;sports[x.sport]=(sports[x.sport]||0)+1}
  return {pool,counts,sports};
}
function filters(){
  const a=availability();
  const active=sportOrder.filter(k=>(a.sports[k]||0)>0).slice(0,6);
  const type=(value,label)=>`<label><input type="checkbox" name="kind" value="${value}" ${(a.counts[value]||0)>0?'checked':'disabled'}> ${label} (${a.counts[value]||0})</label>`;
  return `<aside class="filter-rail"><h3>QUICKIE FILTERS</h3><div class="filter-group"><span class="filter-label">PARLAYS</span><select id="parlayCount"><option value="1">1 parlay</option><option value="2">2 parlays</option></select></div><div class="filter-group"><span class="filter-label">LEGS EACH</span><select id="legCount">${[2,3,4,5,6].map(n=>`<option value="${n}" ${n===4?'selected':''}>${n} legs</option>`).join('')}</select></div><div class="filter-group"><span class="filter-label">PREDICTION TYPE</span><div class="filter-row">${type('PLAYER_PROP','Player props')}${type('GAME_ML','ML')}${type('TEAM_ODDS','Team odds')}</div></div><div class="filter-group"><span class="filter-label">L&amp;J STYLE</span><select id="tier"><option value="SNS">SNS</option><option value="NORMAL" selected>Normal</option><option value="AGGRESSIVE">Aggressive</option><option value="BEST">Jinx Best Bets</option></select></div><div class="filter-group"><span class="filter-label">SPORTS / LEAGUES — SELECT 1–6</span><div class="sport-list">${sportOrder.map(k=>`<label class="sport-pick"><input type="checkbox" name="sport" value="${k}" ${active.includes(k)?'checked':''} ${(a.sports[k]||0)>0?'':'disabled'}> ${esc(sportNames[k]||k)} (${a.sports[k]||0})</label>`).join('')}</div></div><button id="generate">GENERATE QUICKIE</button><div class="generator-note">Only prediction types and sports with current L&amp;J-evaluated inventory are selectable. SNS ranks primarily by LJPC. Normal ranks by prediction-first POM Value. Aggressive/Demon requires the LJPC gate before payout economics are considered.</div></aside>`}
function add(pool,seen,item){if(!item.pick||watch(item.pick+' '+item.context))return;if(/^FIBA_(Men|Women)$/i.test(String(item.sport||'')))item={...item,sport:'FIBA'};const key=(item.sport+'|'+item.marketClass+'|'+item.pick).toLowerCase();if(seen.has(key))return;seen.add(key);pool.push(item)}
function buildPool(){
  const pool=[],seen=new Set(),now=Date.now(),horizon=now+7*86400000,B=window.LJ_FUTURE_MARKET_BOARD;
  if(!Array.isArray(B?.events)) return pool;
  B.events.forEach(e=>{
    const t=Date.parse(e?.commence_time||'');
    if(!Number.isFinite(t)||t<=now||t>horizon)return;
    const sport=/^FIBA_(Men|Women)$/i.test(String(e.league||''))?'FIBA':String(e.league||'');

    (e.props||[]).forEach(p=>{
      const st=String(p.evaluation_status||'').toUpperCase();
      const verified=p.market_verified===true&&String(p.market_verification||'').toUpperCase()==='EXACT_MARKET_MATCH';
      if(st!=='LJ_EVALUATED'||!verified||p.synthetic===true||p.model_generated===true||!Number.isFinite(Number(p.ljpc)))return;
      const side=String(p.side||'').toUpperCase(),shown=p.display_threshold??p.threshold;
      const line=shown!==null&&shown!==undefined&&shown!==''?' '+shown:'';
      const yesNo=/^(YES|NO)$/.test(side);
      const core=yesNo?`${p.participant}${line} ${p.market} — ${side}`:`${p.participant} ${side}${line} ${p.market}`;
      const rawPrice=p.price!==null&&p.price!==undefined&&p.price!==''?Number(p.price):NaN;
      const fp=fmtPrice(p.price,p.book||p.best_book||'');
      const priceText=fp?(' • '+fp):'';
      const proj=p.player_projection||p.spectrum?.player_projection||{};
      const numStat=v=>v===null||v===undefined||v===''?null:(Number.isFinite(Number(v))?Number(v):null);
      const l5=numStat(proj.l5_average),pred=numStat(proj.projected_output);
      const projText=[l5!==null?`L5 AVG ${l5.toFixed(Math.abs(l5-Math.round(l5))<.05?0:1)}`:'',pred!==null?`L&J PROJ ${pred.toFixed(Math.abs(pred-Math.round(pred))<.05?0:1)}`:''].filter(Boolean).join(' • ');
      const legz=Number(p.legz_baseline??p.ljpc),jinx=Number(p.jinx_input||0),ljpc=Number(p.ljpc),legzValue=Number(p.legz_value||0),pomValue=Number(p.pom_value||(legzValue>0?Math.sqrt(legzValue*ljpc):ljpc));
      add(pool,seen,{sport,marketClass:'PLAYER_PROP',pick:core+priceText,legz,jinxDelta:jinx,ljpc,legzValue,pomValue,price:rawPrice,pomType:String(p.pom_type||p.tier||'NORMAL').toUpperCase(),evaluationId:p.evaluation_id,context:[projText,`${e.away||""} @ ${e.home||""}`].filter(Boolean).join(' • '),provisional:(p.market_baseline_probability!==null&&p.market_baseline_probability!==undefined&&p.market_baseline_probability!==''&&Number.isFinite(Number(p.market_baseline_probability)))?Number(p.market_baseline_probability):null});
    });

    (e.game_markets||[]).forEach(g=>{
      const mc=String(g.market_class||'GAME_ML').toUpperCase();
      if(!['GAME_ML','SPREAD','GAME_TOTAL','TEAM_TOTAL'].includes(mc))return;
      const ljpc=Number(g.ljpc??g.lj_confidence);
      if(!Number.isFinite(ljpc)||ljpc<=0||String(g.evaluation_status||'').toUpperCase()!=='LJ_EVALUATED')return;
      const cls=mc==='GAME_ML'?'GAME_ML':'TEAM_ODDS';
      const participant=String(g.selection||g.participant||'').replace(/\s+ML$/i,'');
      const fp=fmtPrice(g.price,g.book||g.source||'');
      let pick='';
      if(mc==='GAME_ML') pick=`${e.away||""} @ ${e.home||""} — ${participant} ML${fp?` • ${fp}`:""}`;
      else pick=`${e.away||""} @ ${e.home||""} — ${g.selection||g.participant||g.market||mc}${fp?` • ${fp}`:""}`;
      add(pool,seen,{sport,marketClass:cls,pick,legz:ljpc,jinxDelta:Number(g.jinx_input||0),ljpc,legzValue:Number(g.legz_value||0),pomValue:Number(g.pom_value||ljpc),price:Number(g.price),pomType:'NORMAL',directLj:true,provisional:false,context:mc==='GAME_ML'?'JINX GAME WINNER':'L&J TEAM ODDS'});
    });
  });
  return pool;
}
function styleEligible(x,tier){
  const ljpc=Number(x.ljpc||0),pt=String(x.pomType||'NORMAL').toUpperCase();
  if(tier==='SNS'){
    if(ljpc<70)return false;
    return x.marketClass!=='PLAYER_PROP'||pt==='GOBLIN'||pt==='NORMAL';
  }
  if(tier==='NORMAL'){
    return x.marketClass!=='PLAYER_PROP'||pt==='NORMAL';
  }
  if(tier==='AGGRESSIVE'){
    if(ljpc<51.8)return false;
    return x.marketClass!=='PLAYER_PROP'||pt==='DEMON'||pt==='NORMAL';
  }
  return true;
}
function score(x,tier){
  const ljpc=Number(x.ljpc||0),pom=Number(x.pomValue||ljpc);
  if(tier==='SNS')return ljpc;
  if(tier==='NORMAL')return pom;
  if(tier==='BEST')return (ljpc+pom)/2;
  if(tier==='AGGRESSIVE'){
    const price=Number(x.price);
    const economic=Number.isFinite(price)?(price>0?1000+price:1000-Math.abs(price)):0;
    return economic+(ljpc*2);
  }
  return pom;
}
function confHTML(x){const ljpc=Number(x.ljpc||0),hasProv=x.provisional!==null&&x.provisional!==undefined&&x.provisional!==''&&Number.isFinite(Number(x.provisional)),prov=hasProv?Number(x.provisional):null,provHtml=hasProv?`<span class="lj-provisional">${prov.toFixed(prov%1?1:0)}%</span> `:'';const ljpcHtml=`<span class="ljpc-badge"><span class="lj-l">L</span><span class="lj-j">J</span><span class="lj-pc">PC</span> <span class="ljpc-value">${ljpc.toFixed(ljpc%1?1:0)}%</span></span>`;if(x.directLj)return provHtml+ljpcHtml;const sign=x.jinxDelta>=0?'+':'−',j=Math.abs(x.jinxDelta),lv=Number(x.legzValue||0),pv=Number(x.pomValue||ljpc);return `${provHtml}${ljpcHtml}`}
function generate(){const sports=[...document.querySelectorAll('input[name=sport]:checked')].map(x=>x.value),kinds=[...document.querySelectorAll('input[name=kind]:checked')].map(x=>x.value),pc=+document.getElementById('parlayCount').value,lc=+document.getElementById('legCount').value,tier=document.getElementById('tier').value,res=document.getElementById('results'),count=document.getElementById('poolCount'),all=buildPool(),totals={PLAYER_PROP:0,GAME_ML:0,TEAM_ODDS:0};all.forEach(x=>totals[x.marketClass]=(totals[x.marketClass]||0)+1);if(sports.length<1||sports.length>6){res.innerHTML='<div class="empty-state">Select between 1 and 6 sports/leagues with current inventory.</div>';return}if(!kinds.length){res.innerHTML='<div class="empty-state">No selected prediction type currently has eligible L&J inventory.</div>';return}let pool=all.filter(x=>sports.includes(x.sport)&&kinds.includes(x.marketClass)&&styleEligible(x,tier));pool.sort((a,b)=>score(b,tier)-score(a,tier));count.textContent=`${pool.length} match your filters • Current pool: Player Props ${totals.PLAYER_PROP||0} • ML ${totals.GAME_ML||0} • Team Odds ${totals.TEAM_ODDS||0}.`;if(pool.length<lc){res.innerHTML=`<div class="empty-state">Only ${pool.length} current prediction${pool.length===1?'':'s'} cleared these filters. Reduce the leg count or broaden the filters.</div>`;return}const used=new Set(),cards=[];for(let p=0;p<pc;p++){const legs=[];for(const x of pool){if(legs.length>=lc)break;const key=x.sport+'|'+x.pick;if(used.has(key)&&pool.length>=pc*lc)continue;legs.push(x);used.add(key)}if(legs.length<lc)break;const title=tier==='BEST'?'JINX BEST BETS':tier;cards.push(`<article class="parlay-card"><div class="parlay-head">${title} QUICKIE ${p+1} • ${lc} LEGS</div><div class="parlay-body">${legs.map((x,i)=>`<div class="parlay-leg"><div class="leg-main">${i+1}. ${esc(sportNames[x.sport]||x.sport)} • ${esc(x.pick)}</div><div class="leg-sub">${confHTML(x)}<br>${esc(x.context|| (x.marketClass==='PLAYER_PROP'?'Player prop':x.marketClass==='GAME_ML'?'Moneyline':'Team odds'))}</div></div>`).join('')}</div></article>`)}res.innerHTML=cards.join('')||'<div class="empty-state">The current publication pool cannot build this request without reusing or inventing a leg.</div>'}
app.innerHTML=header();document.querySelectorAll('input[name=sport]').forEach(x=>x.addEventListener('change',()=>{const c=document.querySelectorAll('input[name=sport]:checked').length;if(c>6)x.checked=false}));document.getElementById('generate').addEventListener('click',generate);generate();})();
</script><script src="recaplink.js?v=20260917-headerstandard1"></script></body></html>
