name = "dg-market-intelligence"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
ALLOWED_ORIGIN = "https://jordonnes.github.io"

[triggers]
crons = ["*/15 * * * *"]

# Provision a Workers KV namespace and add its binding for BOTH archive persistence\n# and the shared Kalshi metadata cache/cooldown. Until provisioned, cross-instance\n# cooldown coordination is not available (per-POP Cache API only).\n# In Cloudflare Dashboard: Storage & databases > KV > Create namespace,\n# then Workers & Pages > dg-market-intelligence > Settings > Bindings > Add KV,\n# variable name DG_ARCHIVE. Redeploy after adding the binding.
# [[kv_namespaces]]
# binding = "DG_ARCHIVE"
# id = "<YOUR_CLOUDFLARE_KV_NAMESPACE_ID>"
